/* Layout: one screen. The Wilderland green bar on top, a full-bleed zoomable map (or globe) below,
   and a story panel that floats on the right (a bottom sheet on phones). Colors and type follow wilderland.academy. */
:root{
  --paper:#FFFFFF; --card:#FFFFFF; --ink:#121213; --body:#4D4D51; --muted:#6E6E73; --line:#DCDFDC;
  --strong:#015640; --on-strong:#FFFFFF; --blaze:#FF4539; --water:#014987; --lime:#D5F367; --on-lime:#121213;
  --bar:#015640; --bar-ink:#FFFFFF; --bar-soft:#BFD6CC; --bar-line:#2E7560; --bar-field:#0B4A39;
  --sea:#F0F2F0; --grid:#E2E6E2; --ocean:#DDF3F1; --land:#CFE7C2; --land-edge:#9CC08D;
  --tint:#F0F2F0; --spark-bg:#FDE7DF; --spark-ink:#B5172A; --halo:rgba(255,255,255,.9);
  --shadow:rgba(18,18,19,.16); --go-ink:#121213; --ink-l:26%; --tint-l:93%; --dot-l:40%; --is-dark:0;
  --slab:'Uncut Sans', 'Segoe UI', Roboto, Arial, sans-serif;
  --sans:'Uncut Sans', 'Segoe UI', Roboto, Arial, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1F19; --card:#142A22; --ink:#F2F5F2; --body:#C9D3CE; --muted:#9AA8A1; --line:#28443A;
  --strong:#D5F367; --on-strong:#121213; --blaze:#FF6A5F; --water:#7FC8F0; --lime:#D5F367; --on-lime:#121213;
  --bar:#01382A; --bar-ink:#FFFFFF; --bar-soft:#A9C4B9; --bar-line:#2E6352; --bar-field:#0A2C22;
  --sea:#0B1813; --grid:#13241D; --ocean:#0F2A2E; --land:#21402F; --land-edge:#3F6A51;
  --tint:#1A3229; --spark-bg:#3A1E1B; --spark-ink:#FFB4A6; --halo:rgba(11,24,19,.88);
  --shadow:rgba(0,0,0,.5); --go-ink:#121213; --ink-l:82%; --tint-l:17%; --dot-l:66%; --is-dark:1; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0E1F19; --card:#142A22; --ink:#F2F5F2; --body:#C9D3CE; --muted:#9AA8A1; --line:#28443A;
  --strong:#D5F367; --on-strong:#121213; --blaze:#FF6A5F; --water:#7FC8F0; --lime:#D5F367; --on-lime:#121213;
  --bar:#01382A; --bar-ink:#FFFFFF; --bar-soft:#A9C4B9; --bar-line:#2E6352; --bar-field:#0A2C22;
  --sea:#0B1813; --grid:#13241D; --ocean:#0F2A2E; --land:#21402F; --land-edge:#3F6A51;
  --tint:#1A3229; --spark-bg:#3A1E1B; --spark-ink:#FFB4A6; --halo:rgba(11,24,19,.88);
  --shadow:rgba(0,0,0,.5); --go-ink:#121213; --ink-l:82%; --tint-l:17%; --dot-l:66%; --is-dark:1; color-scheme:dark }

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
h1,h2,h3{font-family:var(--slab);font-weight:700;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--water)}
:focus-visible{outline:3px solid var(--water);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.app{height:100%;display:flex;flex-direction:column;min-height:0}

/* ---------- top bar ---------- */
.bar{background:var(--bar);color:var(--bar-ink);display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto;min-width:0}
.mark{display:flex;align-items:center;gap:9px;color:#FFFFFF}
.mark svg{width:150px;height:auto;flex:none;display:block}
.school{font-size:15px;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.brand .div{width:1px;align-self:stretch;background:var(--bar-line)}
.brand h1{font-size:clamp(20px,2.2vw,24px);font-weight:600;letter-spacing:-.01em}
.search{position:relative;flex:1 1 220px;max-width:340px;min-width:0}
.search input{width:100%;min-height:42px;border-radius:8px;border:2px solid var(--bar-line);background:var(--bar-field);color:var(--bar-ink);font:inherit;padding:6px 12px 6px 38px}
.search input::placeholder{color:var(--bar-soft);opacity:1}
.search input:focus{outline:0;border-color:var(--bar-ink)}
.search svg{position:absolute;left:11px;top:11px;width:20px;height:20px;stroke:var(--bar-soft);fill:none;stroke-width:2;stroke-linecap:round;pointer-events:none}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;margin:0;padding:6px;list-style:none;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 34px var(--shadow);max-height:min(420px,60vh);overflow:auto;z-index:20}

<script>
/* Atlas data model. R = realm, W = waypoint (a kind of project), S = story (a real person or group). */
var REALMS = [], WAYS = [], STORIES = [];
function R(id, name, hue, x, y, blurb) { REALMS.push({ id: id, name: name, hue: hue, x: x, y: y, blurb: blurb }); }
function W(realm, id, name, desc, sparks) { WAYS.push({ id: id, realm: realm, name: name, desc: desc, sparks: sparks }); }
/* age: a number when a young person (18 or under) started it, a string label for a group of kids, or 0 for adults. */
function S(id, way, name, tag, place, ll, year, age, did, why, came, sparks, links, q) {
  STORIES.push({ id: id, way: way, name: name, tag: tag, place: place, ll: ll, year: year, age: age,
    did: did, why: why, came: came, sparks: sparks, links: links || [], q: q || name });
}

R("music", "Music & Sound", 285, 900, 500, "Songs, bands, beats and instruments. Music is one of the fastest ways a small group can reach a lot of people.");
R("stage", "Stage & Screen", 353, 1800, 500, "Plays, films, dance, animation and puppets. Stories you perform or record for an audience.");
R("words", "Words & Stories", 46, 2700, 500, "Books, poems, diaries, letters and reporting. Writing that outlasts the person who wrote it.");
R("culture", "History, Culture & Language", 30, 3600, 500, "Languages, maps, family stories and finds from the past. Work that keeps a people's memory alive.");
R("art", "Art & Image", 326, 450, 1300, "Pictures, objects and symbols that change how people see a place or an idea.");
R("make", "Making & Building", 18, 1350, 1300, "Things built by hand: cloth, clay, wood, cardboard, buildings and bridges.");
R("tech", "Invention & Code", 208, 2250, 1300, "Machines, software and clever fixes. Many started as a hobby or a way to solve one family's problem.");
R("games", "Games, Puzzles & Numbers", 262, 3150, 1300, "Board games, video games, puzzles, chess and patterns. Play that teaches people to think.");
R("civic", "Civic Life & Change", 192, 4050, 1300, "Speaking up, changing rules and working for peace. How ordinary people shape the places they live.");
R("adventure", "Body & Adventure", 74, 900, 2100, "Running, sailing, skating and inventing new sports. Projects you do with your whole body.");
R("nature", "Nature & Earth", 147, 1800, 2100, "Forests, rivers, wildlife and night skies. People who looked after a piece of the living world.");
R("science", "Science & Discovery", 172, 2700, 2100, "Experiments, fossils, stars and microscopes. Finding out something nobody knew yet.");
R("enterprise", "Enterprise", 56, 3600, 2100, "Businesses and money put to work. Selling something people want, often to fund something good.");
R("food", "Food & Growing", 95, 1350, 2900, "Gardens, kitchens and shared meals. Growing food and feeding people.");
R("service", "Service & Kindness", 340, 3150, 2900, "Clean water, comfort, teaching and belonging. Projects that start with noticing someone else's need.");

/* ---------- ART & IMAGE ---------- */
W("art", "paint", "Painting & Drawing", "Pictures made by hand, from sketchbooks to portraits to a whole series on one idea.", [
  "Draw the same tree, person or street every day for 30 days. Show all 30 and explain what changed in how you see.",
  "Paint six portraits of people who keep your town running. Hang them where those people will see them."]);
W("art", "mural", "Murals & Public Art", "Art made for a wall, a sidewalk or a park, where everyone walks past it.", [
  "Find a blank wall or fence, get permission, design a mural with the people who use the space, and paint it.",
  "Put one question on a chalkboard in a public place. Collect a week of answers and turn them into a display."]);
W("art", "sculpt", "Sculpture & Found Objects", "Building in three dimensions from clay, wire, wood, scrap or junk.", [
  "Collect one kind of thrown-away object for a month. Build a sculpture that makes people look at it differently.",
  "Make a sculpture trail of five pieces along a path at school, each with a small label."]);
W("art", "photo", "Photography", "Using a camera to notice what other people walk past.", [
  "Photograph one subject 100 ways: hands at work, doors, frost, shadows. Print your best 12 and hold a show.",
  "Make portraits of ten elders in your community with one sentence from each about their life."]);
W("art", "landart", "Art Made from Nature", "Leaves, stones, ice and sticks arranged outdoors, then left for the weather to take back.", [
  "Build one outdoor piece each week for a season from what you find on the ground. Photograph each before it disappears.",
  "Design a stone or willow sculpture for the school grounds that younger kids can walk through."]);
W("art", "comics", "Comics & Illustration", "Stories told in panels and pictures.", [
  "Write and draw a 24-page comic. Print copies and put them in the school library.",
  "Illustrate a picture book for a younger class about something they are learning."]);
W("art", "sciart", "Scientific Illustration", "Drawing plants, animals and rocks so accurately that scientists can use the picture.", [
  "Make a field guide to 20 plants or insects within a mile of school, drawn from life.",
  "Raise caterpillars and draw every stage until they fly."]);
W("art", "design", "Design, Flags & Symbols", "Posters, logos, flags and signs. Pictures with a job to do.", [
  "Design a flag or emblem for your class, valley or town. Explain every color and shape, then get it adopted.",
  "Redesign a confusing sign or form that people at school really use. Test it on ten people."]);
W("art", "digital", "Digital Art & 3D", "Animation, 3D models and images made on a screen, then brought into the room.", [
  "Model a real local building or landform in 3D, print it or project it, and present it next to the real thing.",
  "Design a set of digital illustrations and print them as cards or posters you can hand out."]);

S("jr", "mural", "JR and Inside Out", "A stranger's face, two stories tall", "Paris, France", [48.86, 2.35], "2011", 0,
  "JR is a French street artist who pastes huge black-and-white portraits on buildings. When he won a big prize in 2011, he used it to start Inside Out. Any group can send in portraits and a message. His studio mails back giant posters for them to paste up in their own town.",
  "It turned ordinary people into the artwork. A whole neighborhood could say “look at us” without needing a museum.",
  "By 2022 nearly 500,000 posters had gone to 148 countries, including hundreds of projects run by schools.",
  ["Photograph people at your school or in your town who rarely get noticed. Print the portraits large and show them in a public place with one line from each person."],
  ["photo", "local", "oral"], "Inside Out Project JR");
S("anatsui", "sculpt", "El Anatsui", "Bottle caps into golden cloth", "Nsukka, Nigeria", [6.86, 7.39], "since the 1990s", 0,
  "El Anatsui, a sculptor from Ghana, found a bag of thrown-away bottle caps by the road. He and his helpers flatten thousands of them and stitch them together with copper wire into shimmering sheets as big as a house wall.",
  "He showed that the stuff a place throws out can carry its history. The caps came from drinks first brought to West Africa by traders.",
  "His hangings have covered museum fronts around the world, and each time they are hung in a new shape.",
  ["Pick one kind of waste your school makes a lot of. Build a large hanging from it and display it where the waste comes from."],
  ["waste", "textile"], "El Anatsui");
S("nekchand", "sculpt", "Nek Chand's secret garden", "Eighteen years of building in hiding", "Chandigarh, India", [30.75, 76.81], "1957", 0,
  "Nek Chand was a road inspector. In his spare time he rode his bicycle to dump sites, collected broken tiles, bangles and sinks, and built a hidden kingdom of sculptures in a forest. He kept it secret for 18 years because the land was protected.",
  "When officials found it in 1975 it covered 12 acres and they could have torn it down. People loved it so much that the city gave him a salary and workers instead.",
  "The Rock Garden now covers 40 acres with thousands of figures, and thousands of people visit each day.",
  ["Start a small sculpture garden from broken and found things in an unused corner. Add one piece every week and invite visitors at the end."],
  ["waste", "cardboard", "landart"], "Rock Garden of Chandigarh");
S("bentley", "photo", "Wilson “Snowflake” Bentley", "The farm boy who photographed snow", "Jericho, Vermont, USA", [44.50, -72.99], "1885", 15,
  "At 15, Wilson Bentley got a microscope and tried to draw snowflakes before they melted. It was impossible. So he joined a camera to the microscope and kept trying through freezing winters. At 19 he took the first photograph ever made of a single snow crystal.",
  "Nobody had been able to study the shape of snow before. His pictures showed that every crystal he caught was different.",
  "He photographed more than 5,000 snowflakes over his life. Scientists and artists still use his images.",
  ["Choose something tiny or brief that people never see properly: frost, seeds, insect wings, soap film. Find a way to photograph it and make an exhibition."],
  ["micro", "earth"], "Wilson Bentley");
S("merian", "sciart", "Maria Sibylla Merian", "She drew what caterpillars become", "Frankfurt, Germany", [50.11, 8.68], "1660", 13,
  "At 13, Maria Sibylla Merian began raising silkworms and other caterpillars and painting every stage of their lives. Most people then believed insects grew out of mud. At 52 she sailed to Suriname in South America with her daughter to paint rainforest insects from life.",
  "Her paintings showed egg, caterpillar, cocoon and butterfly together on the plant each one eats. That is how ecologists still think about insects.",
  "Her 1705 book amazed Europe. Scientists used her pictures to name species for more than a century.",
  ["Raise one kind of insect from egg to adult. Paint or draw each stage on its food plant and bind the pages into a book."],
  ["pollin", "wildlife", "experiment"], "Maria Sibylla Merian");
S("pilkey", "comics", "Dav Pilkey", "Comics from the hallway", "Elyria, Ohio, USA", [41.37, -82.10], "1970s", 8,
  "In second grade, Dav Pilkey had trouble sitting still and reading, and his teacher often sent him to a desk in the hallway. He used the time to draw comics. One of his characters was a superhero in underpants. A teacher ripped one up and told him he couldn't spend his life making silly books.",
  "He kept the idea for twenty years. He has said the things that got him in trouble were the same things that made his books work.",
  "Captain Underpants and Dog Man have sold tens of millions of copies and got many kids reading who thought they hated it.",
  ["Create your own comic series with at least three issues. Print copies, lend them out, and collect reader reviews."],
  ["fiction", "zine"], "Dav Pilkey");
S("beforeidie", "mural", "Candy Chang's wall", "One sentence for a whole neighborhood", "New Orleans, USA", [29.95, -90.07], "2011", 0,
  "After someone she loved died, artist Candy Chang painted the side of an abandoned house with chalkboard paint. She stenciled one line many times: “Before I die I want to ___.” She left chalk. By the next day the wall was full.",
  "Neighbors who never spoke learned each other's hopes. An empty building became the place where the street talked.",
  "People have copied the wall thousands of times in dozens of countries and many languages.",
  ["Build a public wall, board or box that asks your community one good question. Photograph and sort the answers, then report what you learned."],
  ["local", "kind", "design"], "Before I Die Candy Chang");
S("joewhale", "paint", "Joe Whale, the Doodle Boy", "In trouble for doodling, then hired for it", "Shrewsbury, England", [52.71, -2.75], "2019", 9,
  "Joe Whale kept getting told off for doodling in class. His parents signed him up for an after-school art club, and the teacher posted his drawings online. A local restaurant asked the 9-year-old to cover a dining room wall with doodles.",
  "A habit that looked like a problem at a desk turned out to be a skill when it had the right place to go.",
  "He went on to illustrate books and, at 12, signed a deal to make art with Nike.",
  ["Find the right home for the thing you can't stop doing. Offer to decorate a real wall, window or object for a local business or the school."],
  ["mural", "kidbiz"], "Joe Whale Doodle Boy");
S("benson", "design", "Benny Benson", "A 14-year-old designs Alaska's flag", "Seward, Alaska, USA", [60.10, -149.44], "1927", 14,
  "Alaska held a contest for students to design its flag. About 700 entered. Benny Benson, a 14-year-old Unangan boy living in a children's home, drew eight gold stars on a blue field: the Big Dipper and the North Star. He wrote what each part meant.",
  "His design was simple enough for anyone to draw and came from the sky he looked at every night.",
  "He won a $1,000 scholarship and a watch. His flag still flies as the Alaska state flag.",
  ["Design a flag for your school, valley or club. Follow the rules of good flag design, explain every choice, and campaign to have it adopted."],
  ["law", "sky", "tradition"], "Benny Benson");

/* ---------- MUSIC & SOUND ---------- */
W("music", "song", "Songwriting", "Writing words and melody that say something true.", [
  "Write and record three songs about your own place and people. Perform them live for an audience.",
  "Write a song with a younger class about something they care about, and teach them to perform it."]);
W("music", "band", "Bands & Orchestras", "People playing together, which is harder and better than playing alone.", [
  "Start a band or ensemble, rehearse weekly for eight weeks, and play a 20-minute set in public.",
  "Learn a demanding instrument from scratch and perform a piece that is a clear stretch for you."]);
W("music", "instr", "Instrument Building", "Making the thing that makes the sound.", [
  "Build a playable instrument from scrap or wood. Tune it, learn a song on it, and perform.",
  "Build a set of outdoor instruments for the school yard that anyone can play."]);
W("music", "hiphop", "Hip-Hop & Beats", "Rhymes, rhythm and beats made with a voice, a turntable or a laptop.", [
  "Write and record a rap about your school or valley with a group. Make a video and premiere it.",

  "Write the score for a classmate's film or play."]);
W("music", "record", "Recording & Producing", "Capturing sound well and shaping it into something finished.", [

W("music", "choir", "Singing Together", "Choirs, rounds and sing-alongs. The oldest group project there is.", [

W("music", "trad", "Music Traditions", "Fiddle tunes, drumming, folk songs and dances passed from person to person.", [

S("kabin", "hiphop", "Kabin Crew and Lisdoonvarna Crew", "The Spark", "Cork, Ireland", [51.90, -8.47], "2024", "Ages 9–12",
  "About 15 kids from two groups wrote a rap together. Kabin Crew meet at a small youth studio in Cork. Lisdoonvarna Crew are children living in a centre for families seeking safety in Ireland. They wrote “The Spark” in workshops for Ireland's national day of creativity for young people, and filmed the video on a bus and in the street.",
  "The song is about kids believing in their own ideas. It was written by kids, in their own accents, about their own lives.",
  "The video drew millions of views within weeks. DJs played it at Glastonbury, it charted in the UK and US, the kids performed for crowds of thousands, and it became a dance in Fortnite.",
  ["Write a group anthem about where you live, in your own voices. Record it, film a video in real local places, and release it at a showcase.",
   "Pair up with kids from a different school or background and make one song together."],
  ["film", "song", "include"], "The Spark Kabin Crew");
S("cateura", "instr", "Recycled Orchestra of Cateura", "Violins from a landfill", "Asunción, Paraguay", [-25.33, -57.63], "2006", 0,
  "Cateura is a neighborhood built beside a huge landfill. Music teacher Favio Chávez had more students than instruments, and a violin cost more than a house there. A trash picker and carpenter named Nicolás Gómez began building violins from oil cans, cellos from drums and flutes from pipes.",
  "Children who had nothing to practice on became an orchestra. As Chávez put it, the world sends them garbage and they send back music.",
  "The orchestra has toured the world, and a film about it, Landfill Harmonic, has been shown in many countries.",
  ["Build three working instruments from recycled materials and perform a real piece on them with friends."],
  ["waste", "band", "cardboard"], "Recycled Orchestra of Cateura");
S("sistema", "band", "El Sistema", "Eleven kids in a parking garage", "Caracas, Venezuela", [10.49, -66.88], "1975", 0,
  "José Antonio Abreu, an economist and musician, called a first rehearsal for a youth orchestra in a parking garage. Eleven children came. He promised them they would become one of the great orchestras of the world. He offered free instruments and daily group lessons to any child.",
  "It treated an orchestra as a place where kids learn to listen, work hard and belong, whatever their family's income.",
  "Hundreds of thousands of Venezuelan children have played in it, and programs modeled on it run in dozens of countries.",
  ["Start a free weekly music group for younger kids. Teach them one piece and put on a concert."],
  ["teach", "include", "team"], "El Sistema");
S("steelpan", "trad", "The steelpan", "An orchestra from oil drums", "Port of Spain, Trinidad and Tobago", [10.66, -61.51], "1930s–40s", 0,
  "Colonial rulers in Trinidad banned skin drums, then bamboo drumming. Young men in poor neighborhoods kept the rhythm going on biscuit tins, dustbin lids and oil drums. They noticed that a dent hammered into the metal rang with its own note, and tuners like Winston “Spree” Simon, Ellie Mannette and Anthony Williams turned the drums into full instruments.",
  "A whole new family of instruments was invented by teenagers and young men with hammers and scrap.",
  "In 1951 a steel orchestra played in London to astonished crowds. The steelpan is now the national instrument of Trinidad and Tobago and is played around the world.",
  ["Take a material people throw away and work out how to get a scale of notes from it. Build a set and play a tune."],
  ["instr", "tradition", "waste"], "Steelpan");
S("hiphop73", "hiphop", "The back-to-school party", "How hip-hop began", "The Bronx, New York, USA", [40.85, -73.92], "1973", "Teens",
  "Cindy Campbell wanted money for new school clothes. In August 1973 she threw a party in the recreation room of her apartment building and charged a few cents at the door. Her 18-year-old brother Clive, known as DJ Kool Herc, played records. He used two copies of the same record to stretch out the drum breaks that dancers loved.",
  "That trick of looping the break became the foundation of hip-hop music.",
  "From one rec room, hip-hop grew into one of the most popular kinds of music, dance and art on Earth.",
  ["Plan, promote and run a real event for your community with music you choose or make. Keep a budget and report what you earned and spent."],
  ["market", "dance", "local"], "Birth of hip hop 1520 Sedgwick Avenue");
S("nandi", "band", "Nandi Bushell", "The 10-year-old who challenged a rock star", "Ipswich, England", [52.06, 1.15], "2020", 10,
  "Nandi Bushell had been posting videos of herself drumming since she was small. At 10 she posted a cover of a Foo Fighters song and challenged their leader, Dave Grohl, to a drum battle. He answered. They traded videos for months and he wrote a song about her.",
  "She practiced for years in her family's living room and was bold enough to ask.",
  "A year later, at 11, she walked on stage in Los Angeles and played with the band in front of thousands of people.",
  ["Get good enough at an instrument to perform a hard piece in public. Document your practice from week one so people can see the climb."],
  ["record", "film"], "Nandi Bushell");
S("vchoir", "choir", "The Virtual Choir", "Thousands of singers, each alone", "Online, from 129 countries", [34.05, -118.24], "2010", 0,
  "A young fan posted a video of herself singing one of composer Eric Whitacre's pieces. He wondered what would happen if many people did the same. He posted a video of himself conducting and asked singers to record their parts at home. His team stitched 185 videos into one choir.",
  "People who lived far from any choir could sing in one. It was made years before video calls were normal.",
  "The sixth Virtual Choir, in 2020, joined 17,572 singers from 129 countries.",
  ["Build a piece of music from recordings made by people in different places: relatives, alumni, a partner school. Edit them into one performance and premiere it."],
  ["record", "letters", "digital"], "Eric Whitacre Virtual Choir");
S("goldenrecord", "sound", "The Voyager Golden Record", "A mixtape for the stars", "Cape Canaveral, Florida, USA", [28.39, -80.60], "1977", 0,
  "Before two Voyager spacecraft left Earth, a small team led by astronomer Carl Sagan had less than a year to decide what to send with them. They chose 115 pictures, greetings in 55 languages, a baby crying, whale song, thunder, and 90 minutes of music from Bach to Chuck Berry to Peruvian panpipes.",
  "They had to answer a huge question: what would you want a stranger to know about us?",
  "Both spacecraft have now left the Sun's neighborhood and are flying between the stars, each carrying a copy of the record.",
  ["Make a “golden record” for your community or your generation. Choose the sounds, songs, pictures and greetings, defend every choice, and present it."],
  ["astro", "oral", "museum"], "Voyager Golden Record");
S("alma", "compose", "Alma Deutscher", "An opera at age 11", "Vienna, Austria", [48.21, 16.37], "2016", 10,
  "Alma Deutscher, from England, began writing down melodies when she was very young. Over several years she composed a full-length opera, Cinderella, in which Cinderella is a composer and the prince is a poet. A professional company in Vienna staged it when she was 11.",
  "She took a form most people think belongs to long-dead adults and wrote a new one for her own time.",
  "The opera has since been performed in several countries, and she now conducts her own work.",
  ["Compose a set of pieces or a short musical. Get real musicians to perform it for an audience."],
  ["theater", "worlds"], "Alma Deutscher");

S("raiders", "film", "Raiders: The Adaptation", "Three kids, seven summers, one movie", "Ocean Springs, Mississippi, USA", [30.41, -88.83], "1982", 12,
  "Three 12-year-olds, Chris Strompolos, Eric Zala and Jayson Lamb, decided to remake Raiders of the Lost Ark shot for shot. They had no copy of the film to study at first, only memory, a comic book and a recording of the sound. They filmed every summer for seven years with allowance money, building sets in a basement.",
  "They finished something enormous by simply refusing to stop.",
  "Years later the tape reached film fans and then Steven Spielberg, who wrote to them and invited them to his office. In 2014 they filmed the one scene they had skipped, as adults.",
  ["Remake a favorite scene or short film exactly, solving every effect with what you have. Screen the original and yours together."],
  ["cardboard", "fashion"], "Raiders of the Lost Ark: The Adaptation");
S("amal", "puppet", "Little Amal", "A giant puppet walks 8,000 km", "Gaziantep, Türkiye, to Manchester, England", [37.07, 37.38], "2021", 0,
  "Little Amal is a 3.5-meter puppet of a 10-year-old Syrian girl looking for her mother. Puppeteers walked her from the Syrian border across Europe to England in 2021. In each town, local people planned a welcome: lanterns, music, letters from children.",
  "Millions of real children have had to leave their homes because of war. Amal made that easy to see and hard to ignore.",
  "She walked through 65 towns on that first journey and has since visited many more countries.",
  ["Build a large puppet that stands for someone people tend to overlook. Plan a walk or event where your community meets it."],
  ["peace", "campaign", "include"], "Little Amal");
S("miranda", "theater", "Lin-Manuel Miranda", "A musical started in a dorm room", "New York City, USA", [40.87, -73.92], "1999", 0,
  "As a college sophomore, Lin-Manuel Miranda wrote the first draft of a musical about his own neighborhood in upper Manhattan, with rap and salsa in the songs. Almost no musicals sounded like the people he grew up with. He put it on with other students.",
  "He wrote the show he wanted to see and couldn't find.",
  "After years of rewriting, In the Heights reached Broadway and won the top prize for musicals. His next show, Hamilton, took him another six years to write.",
  ["Write a short musical or play about your own neighborhood, in the way people there really talk. Stage a reading, revise it, then perform it."],
  ["song", "hiphop", "oral"], "In the Heights musical");
S("nickpark", "anim", "Nick Park", "Clay films from the attic", "Preston, England", [53.76, -2.70], "1971", 13,
  "At 13, Nick Park started making animated films in his parents' attic with his mother's home movie camera. As a film student he began a clay film about an inventor and his dog flying to the moon. It was so slow to make that it took him seven years to finish.",
  "Stop-motion is done one tiny movement at a time. He stuck with a single short film for most of a decade.",
  "That film introduced Wallace and Gromit. He has since won four Academy Awards.",
  ["Make a stop-motion short with characters you design and build. Plan every shot on a storyboard first."],
  ["clay", "comedy", "mech"], "Nick Park");
S("reiniger", "anim", "Lotte Reiniger", "A feature film cut from paper", "Berlin, Germany", [52.52, 13.40], "1926", 0,
  "Lotte Reiniger loved cutting paper silhouettes as a girl. In her twenties she and a small team spent three years moving hinged paper figures a fraction at a time under a camera. The result was The Adventures of Prince Achmed.",
  "It is the oldest animated feature film that still survives, finished eleven years before Disney's first.",
  "She made more than 40 films, and animators still study her scissors-and-paper method.",
  ["Make a silhouette animation of a folk tale using cut paper and a lightbox."],
  ["origami", "tradition", "paint"], "Lotte Reiniger");
S("zuriel", "doc", "Zuriel Oduwole", "A filmmaker at nine", "Los Angeles, USA", [34.05, -118.24], "2012", 9,
  "For a school history contest, 9-year-old Zuriel Oduwole made a documentary about Ghana and interviewed two of its former presidents. She kept making films. At 12 she became one of the youngest people to have a self-made film shown in cinemas.",
  "She used her camera to get in the room with leaders, then asked them about girls who are kept out of school.",
  "She has interviewed more than 30 presidents and prime ministers and runs filmmaking classes for girls in several African countries.",
  ["Make a documentary that requires you to interview people with real authority: a mayor, an elder, an expert. Prepare questions that matter."],
  ["rights", "news", "debate"], "Zuriel Oduwole");
S("henson", "puppet", "Jim Henson", "A frog from an old coat", "Hyattsville, Maryland, USA", [38.96, -76.95], "1954", 17,
  "Jim Henson joined his high school puppet club and got a job doing puppets on a local TV show at 17. A year later he had his own five-minute show. He built one puppet from his mother's old green coat and half a ping-pong ball. He called it Kermit.",
  "He worked out that a soft puppet in close-up on TV could show feelings that stiff wooden puppets could not.",
  "The Muppets and Sesame Street followed, and they have taught and entertained children in more than 100 countries.",
  ["Design and sew your own puppet characters and film a short series of episodes with them."],
  ["textile", "film", "teach"], "Jim Henson");
S("ailey", "dance", "Alvin Ailey", "Dances from a Texas childhood", "Rogers, Texas, USA", [30.93, -97.23], "1960", 0,
  "Alvin Ailey grew up in small Texas towns, where church music and Saturday dances stayed in his mind. At 29 he turned those memories into Revelations, a dance set to spirituals and gospel songs.",
  "He put the experience of Black Americans at the center of modern dance, on the world's biggest stages.",
  "Revelations has been performed around the world for more than 60 years and is one of the most widely seen modern dances ever made.",
  ["Choreograph a piece built from your own memories of a place, with music that belongs to it."],
  ["trad", "oral", "tradition"], "Revelations Alvin Ailey");

W("words", "fiction", "Novels & Stories", "Made-up people in trouble, written well enough that readers care.", [
  "Write a novella or a collection of five short stories. Revise it twice with readers' feedback and print copies.",
  "Write and illustrate a chapter book for a younger class and read it to them."]);
W("words", "poetry", "Poetry & Spoken Word", "Few words, chosen hard, often meant to be heard aloud.", [
  "Write a collection of 15 poems on one theme. Perform your best five at an open mic you organize.",
  "Write a poem for a real public occasion and read it there."]);
W("words", "news", "Reporting & Blogs", "Finding out what is really happening and telling people.", [
  "Start a school or valley newspaper. Publish four issues with real interviews.",
  "Investigate one question about your school, like where the lunch food comes from, and publish what you find."]);
W("words", "diary", "Diaries & Memoir", "Writing down a life as it happens.", [
  "Keep a daily record of a season or a big change. Edit it into a short book.",
  "Write the story of one year in your family, with photographs and interviews."]);
W("words", "codes", "Writing Systems & Codes", "Alphabets, ciphers and other ways to put language on a page.", [
  "Invent a writing system or code for a real need. Teach it to five people and exchange messages.",
  "Learn braille or sign language well enough to make something useful for people who rely on it."]);
W("words", "letters", "Letters & Pen Pals", "A page sent to one person, sometimes with large results.", [
  "Write to ten people whose work you admire with one good question each. Publish the replies.",
  "Set up a pen-pal exchange between your class and a school in another country, and present what you learned."]);
W("words", "library", "Libraries & Book-Sharing", "Getting books to the people who don't have them.", [
  "Build and stock a small free library for a place that needs one, and keep it filled.",
  "Run a book drive for one kind of book that is missing from your school's shelves."]);
W("words", "zine", "Zines & Self-Publishing", "Small magazines and books you print yourself.", [
  "Publish a zine on something you know a lot about. Print 50 copies and get them into readers' hands.",
