W("words", "worlds", "Invented Worlds & Languages", "Maps, histories and languages for places that don't exist.", [
  "Invent a language with its own grammar and 200 words. Write a short story in it with a translation.",
  "Build a world with a map, a history and three cultures, and write the stories that happen there."]);

S("korman", "fiction", "Gordon Korman", "A novel for seventh-grade English", "Thornhill, Ontario, Canada", [43.81, -79.42], "1976", 12,
  "Gordon Korman's seventh-grade English class was taught by the track coach, who told the students to spend the term writing a novel. Gordon wrote a funny story about two boys at a boarding school. He was the class monitor for book orders, so he mailed his manuscript to the address on the order form.",
  "He treated a school assignment as a real book and sent it to a real publisher.",
  "Scholastic published it when he was 14. He has written more than 100 books since.",
  ["Write a full short novel this term. Revise it properly and submit it to a real contest or publisher for young writers."],
  ["comedy", "zine"], "Gordon Korman");
S("shelley", "fiction", "Mary Shelley", "A ghost story contest", "Lake Geneva, Switzerland", [46.25, 6.18], "1816", 18,
  "In the cold, stormy summer of 1816, 18-year-old Mary Shelley and her friends were stuck indoors. One of them, the poet Lord Byron, dared everyone to write a ghost story. Mary struggled for days. Then she imagined a student who builds a living creature and is horrified by it.",
  "Her story asked a question people still argue about: what do inventors owe to the things they create?",
  "Frankenstein was published when she was 20. Many people count it as the first science fiction novel.",
  ["Hold a story contest with friends on one prompt. Collect the best entries into a printed book."],
  ["invent", "theater", "experiment"], "Mary Shelley Frankenstein");
S("annefrank", "diary", "Anne Frank", "The diary from the secret annex", "Amsterdam, Netherlands", [52.37, 4.88], "1942", 13,
  "Anne Frank got a diary for her thirteenth birthday. Weeks later her Jewish family went into hiding from the Nazis in rooms behind her father's office. For two years she wrote about fear, boredom, arguments and hope. After hearing on the radio that diaries would be collected after the war, she began rewriting hers as a book.",
  "She wrote honestly about being a teenager while the worst was happening outside. Readers meet one real girl, which no history textbook can give them.",
  "Anne did not survive the war. Her father published the diary in 1947. It has been translated into more than 70 languages.",
  ["Keep an honest diary through a season, then edit it for readers the way Anne did. Decide what to keep, cut and explain."],
  ["oral", "rights", "peace"], "The Diary of a Young Girl");
S("gorman", "poetry", "Amanda Gorman", "A poem for the whole country", "Los Angeles, USA", [34.05, -118.30], "2017", 0,
  "As a child, Amanda Gorman had a speech difficulty that made some sounds hard to say. She practiced by reading and performing poems aloud. At 19 she was named the first National Youth Poet Laureate. At 22 she read her poem at a presidential inauguration, the youngest poet ever to do so.",
  "She turned the thing that was hardest for her into the center of her work.",
  "Millions watched her read, and her books of poems became bestsellers.",
  ["Write and perform a poem for a real public occasion in your school or town. Rehearse until you can deliver it without the page."],
  ["debate", "song"], "Amanda Gorman");
S("tolkien", "worlds", "J.R.R. Tolkien", "Languages first, then a world to hold them", "Birmingham, England", [52.48, -1.90], "1900s", 13,
  "As a schoolboy, John Ronald Tolkien made up languages with his cousins, then harder ones on his own. As an adult he kept inventing Elvish languages with full grammar and history. He said he wrote his stories to give those languages a world where they could be spoken.",
  "His private hobby became the deepest invented world anyone had built. The map in The Hobbit even has a region called Wilderland.",
  "The Hobbit and The Lord of the Rings have sold well over 100 million copies and shaped almost all fantasy written since.",
  ["Invent a language or a detailed world as a long project. Then write one story that could only happen there."],
  ["language", "maps", "decipher"], "Languages constructed by Tolkien");
S("braille", "codes", "Louis Braille", "Reading with fingertips", "Paris, France", [48.85, 2.32], "1824", 12,
  "Louis Braille lost his sight after an accident at age three. At his school for blind children, the few books had huge raised letters and were slow to read. At 12 he learned about an army code of raised dots for reading in the dark. He spent three years simplifying it into a cell of six dots that fits under one fingertip.",
  "For the first time, blind people could read quickly and also write for themselves.",
  "His system was finished when he was 15. It is now used for nearly every written language, and for music and math.",
  ["Find a group that is shut out of something by its design. Work with them to redesign it, and test your version with real users."],
  ["assist", "include", "puzzle"], "Louis Braille");
S("biblioburro", "library", "Luis Soriano's Biblioburro", "A library on two donkeys", "La Gloria, Colombia", [8.62, -73.80], "late 1990s", 0,
  "Luis Soriano, a primary school teacher, saw that his students in remote villages had no books at home. He loaded his own 70 books onto two donkeys, named Alfa and Beto, and rode out on weekends to read with children and lend them books.",
  "He used what he already had, on the only roads there were.",
  "People around the world sent books. His collection grew into the thousands, and others copied the idea.",
  ["Work out who near you can't easily get to books and build a way to bring books to them on a regular schedule."],
  ["teach", "trails", "elders"], "Biblioburro");
S("lfl", "library", "Little Free Library", "A book box on a post", "Hudson, Wisconsin, USA", [44.97, -92.76], "2009", 0,
  "Todd Bol's mother was a teacher who loved books. After she died, he built a small wooden model of a one-room schoolhouse, filled it with books, and put it on a post in his front yard with a sign: free books. Neighbors loved it, so he and a friend built more.",
  "It made sharing books as easy as walking past a mailbox, and it got neighbors talking.",
  "There are now more than 150,000 registered Little Free Libraries in over 100 countries.",
  ["Design and build a free library for a spot that needs one. Register it, stock it, and track what people take and leave."],
  ["wood", "local", "kind"], "Little Free Library");
S("marley", "library", "Marley Dias", "#1000BlackGirlBooks", "West Orange, New Jersey, USA", [40.80, -74.24], "2015", 11,
  "In sixth grade, Marley Dias told her mother she was tired of being assigned books about white boys and their dogs. Her mother asked what she was going to do about it. Marley set out to collect 1,000 books with Black girls as the main characters and give them to schools.",
  "She noticed who was missing from the shelf and fixed it for other kids as well as herself.",
  "She passed 9,000 books within months and later wrote a book of her own.",
  ["Audit your classroom or school library for whose stories are missing. Run a drive to fill the gap and present the before and after."],
  ["rights", "campaign", "schoolvoice"], "Marley Dias");
S("martha", "news", "Martha Payne's lunch blog", "NeverSeconds", "Lochgilphead, Scotland", [56.04, -5.43], "2012", 9,
  "For a writing project, 9-year-old Martha Payne started a blog with her dad's help. Each day she photographed her school lunch and rated it for taste, health and number of hairs. The local council banned her from taking photos. People around the world objected, and the ban was dropped the next day.",
  "She reported exactly what she saw, politely and with evidence. That was enough to make adults pay attention to school food.",
  "Readers donated more than £140,000 through her blog to a charity that feeds children at school. It paid for a kitchen at a school in Malawi.",
  ["Pick one everyday thing at school and report on it daily for a month with photos and fair ratings. Publish it and propose improvements."],
  ["cook", "schoolvoice", "fundraise"], "NeverSeconds");
S("samantha", "letters", "Samantha Smith", "A letter to the other side", "Manchester, Maine, USA", [44.32, -69.86], "1982", 10,
  "In 1982 the United States and the Soviet Union had thousands of nuclear weapons pointed at each other. Samantha Smith, age 10, wrote to the new Soviet leader and asked whether he was going to start a war. He wrote back, said no, and invited her to visit. She spent two weeks there and stayed at a camp with Soviet children.",
  "Children in both countries saw that kids on the other side were ordinary and friendly.",
  "She became known as America's youngest ambassador. A foundation in her name later sent students on exchange visits between the two countries.",
  ["Write real letters to people who hold power or who seem to be on the other side of something. Share the replies and what surprised you."],
  ["peace", "campaign", "law"], "Samantha Smith");
S("dolly", "library", "Dolly Parton's Imagination Library", "A book in the mailbox every month", "Sevier County, Tennessee, USA", [35.87, -83.56], "1995", 0,
  "Singer Dolly Parton's father was one of the smartest people she knew, but he never learned to read. In 1995 she started mailing a free book every month to every child under five in the Tennessee county where she grew up.",
  "Children got their own books at home before they started school, whatever their family could afford.",
  "The program spread to five countries and has given away more than 200 million books.",
  ["Start a small book-giving program for young children nearby, with a list of great titles and a plan to pay for them."],
  ["fundraise", "teach", "song"], "Imagination Library");

/* ---------- SCIENCE & DISCOVERY ---------- */
W("science", "astro", "Astronomy & Space", "Stars, planets, comets and the search for what else is out there.", [
  "Observe one thing in the sky for two months: the Moon, Jupiter's moons, a variable star. Chart it and explain the pattern.",
  "Join a search for supernovas or asteroids using real telescope images."]);
W("science", "fossil", "Fossils & Deep Time", "Reading the history of life from rock.", [
  "Survey the rocks and fossils within reach of your school. Build a labeled collection and a timeline.",
  "Work with a local museum or geologist on a real dig or a collection that needs sorting."]);
W("science", "experiment", "Experiments & Science Fairs", "Asking a question nobody around you can answer, then testing it fairly.", [
  "Design an original experiment about something that puzzles you. Run it at least three times and enter it in a science fair.",
  "Test a common claim, like which brand lasts longest or which paper airplane flies farthest, with real data."]);
W("science", "citsci", "Citizen Science", "Ordinary people collecting or sorting data that scientists need.", [
  "Join a citizen science project for a season and contribute data every week. Present what the data show.",
  "Start a local count of something nobody is tracking: birds at one feeder, snow depth, a stream's clarity."]);
W("science", "chem", "Chemistry & Materials", "What things are made of and how to make new ones.", [
  "Develop a useful material from kitchen or garden waste, like a glue, dye or bioplastic. Test it against the store-bought kind.",
  "Investigate the chemistry of something local: your tap water, your soil, your snow."]);
W("science", "micro", "Microscopes & Tiny Worlds", "Life too small to see without help.", [
  "Explore pond water, soil and snow under a microscope across a season. Make an illustrated guide to what lives there.",
  "Build your own microscope and document what you can see with it."]);
W("science", "health", "Health & Medicine", "Understanding bodies and helping them work.", [
  "Study one health question in your community, like sleep, hydration or sunscreen use, with a careful survey.",
  "Design a low-cost tool or guide that helps people with one health task, and test it with users."]);
W("science", "earth", "Earth, Weather & Oceans", "Mapping and measuring the planet itself.", [
  "Run a weather station for a season. Compare your records to the official forecast.",
  "Map something physical nobody has mapped well: a stream bed, snowpack on a slope, the rocks of one canyon."]);
W("science", "physics", "Physics & Big Ideas", "Light, motion, energy and time.", [
  "Build a device that demonstrates one physics idea clearly, and teach it to a younger class.",
  "Pick one famous thought experiment or discovery and recreate the reasoning with your own demonstrations."]);

S("blackawton", "experiment", "The Blackawton Bees", "A real science paper by 8-year-olds", "Blackawton, Devon, England", [50.34, -3.68], "2010", "Ages 8–10",
  "Twenty-five primary school children worked with a scientist to ask their own question: can bumblebees learn to solve a color puzzle? They built a test with colored lights and sugar water, trained the bees, and recorded what the bees chose.",
  "They found something that was not known before about how bees use color and pattern. Their paper begins “Once upon a time” and the charts are drawn in colored pencil.",
  "A respected science journal published it in 2010 with all the children as authors.",
  ["Pick an animal you can watch safely. Ask a question nobody in your class can answer about how it behaves, then design a fair test."],
  ["pollin", "wildlife", "news"], "Blackawton bees");
S("anning", "fossil", "Mary Anning", "The girl who dug up a sea monster", "Lyme Regis, England", [50.73, -2.94], "1811", 12,
  "Mary Anning's family sold fossils from the sea cliffs to pay for food. When she was 12, her brother found a strange skull. Mary searched for the rest and spent months digging out a skeleton more than five meters long. It was an ichthyosaur, a sea reptile no one alive had seen.",
  "Her finds helped convince scientists that whole kinds of animals had lived and died out long before people.",
  "She went on to find the first complete plesiosaur. Scientists of her time rarely credited her, but museums now display her fossils under her name.",
  ["Become the local expert on one kind of find: fossils, rocks, shells, animal tracks. Build a collection with careful labels and teach others to spot them."],
  ["dig", "museum", "kidbiz"], "Mary Anning");
S("berger", "fossil", "Matthew Berger", "“Dad, I found a fossil!”", "Malapa, South Africa", [-25.90, 27.80], "2008", 9,
  "Nine-year-old Matthew Berger was exploring with his dog while his father, a fossil scientist, searched nearby. Matthew picked up a rock with a bone sticking out and called his dad over. It was the collarbone of an ancient human relative.",
  "The site held two skeletons about two million years old, some of the most complete ever found from that time.",
  "Scientists named a new species from them in 2010, Australopithecus sediba.",
  ["Learn what real finds look like in your area and how to report them properly. Then go looking with an expert."],
  ["dig", "outdoor"], "Australopithecus sediba");
S("burney", "astro", "Venetia Burney", "The 11-year-old who named Pluto", "Oxford, England", [51.75, -1.26], "1930", 11,
  "At breakfast, Venetia Burney's grandfather read aloud that a new planet had been found and needed a name. Venetia, who loved myths and astronomy, suggested Pluto, the Roman god of the dark underworld. Her grandfather passed the idea to an astronomer, who sent it by telegram to the observatory in Arizona.",
  "Her name fit a cold, distant world, and the astronomers voted for it.",
  "Decades later, a dust-measuring instrument built by students flew to Pluto on a NASA spacecraft. It was named after her.",
  ["Learn enough about a new discovery to propose a name, a mission patch or a public explanation for it. Send it to the people in charge."],
  ["letters", "tradition", "worlds"], "Venetia Burney");
S("gray", "astro", "Kathryn Aurora Gray", "A supernova at age 10", "Fredericton, New Brunswick, Canada", [45.96, -66.64], "2011", 10,
  "Kathryn Gray heard that a teenager had discovered a supernova and wanted to try. With her father and a family friend who was an astronomer, she compared new telescope photos of distant galaxies with older ones, flipping between them to look for a new dot of light. Not long after she started, she found one.",
  "It was an exploding star 240 million light-years away. She was the youngest person to discover a supernova at that time.",
  "Other astronomers confirmed it, and her record encouraged more young people to search.",
  ["Join a real search that uses comparison: supernovas, asteroids, changes in satellite photos. Log your method and results."],
  ["citsci", "puzzle"], "Kathryn Aurora Gray");
S("lazen", "chem", "Clara Lazen", "A new molecule in fifth grade", "Kansas City, Missouri, USA", [39.02, -94.59], "2012", 10,
  "Clara Lazen's class was building molecules with ball-and-stick kits. She made an unusual arrangement and asked her teacher if it was real. He didn't know, so he sent a photo to a chemist friend. The chemist checked the databases. Nobody had described it before.",
  "Her question led to a published science paper predicting the new molecule, with Clara listed as an author.",
  "The molecule, tetranitratoxycarbon, has not been made in a lab yet. Chemists think it could store a lot of energy.",
  ["Play seriously with the tools of a science: model kits, simulations, star maps. Write down every “is this real?” question and chase the answers with an expert."],
  ["experiment", "letters"], "Tetranitratoxycarbon");
S("leeuwenhoek", "micro", "Antonie van Leeuwenhoek", "A cloth seller finds a hidden world", "Delft, Netherlands", [52.01, 4.36], "1670s", 0,
  "Antonie van Leeuwenhoek sold cloth and used small lenses to check the threads. As a hobby he learned to grind far better lenses than anyone else had. He looked at pond water, rain and the scrapings from his own teeth, and saw tiny creatures swimming.",
  "He was the first person to see bacteria and other single-celled life. He had no science training at all.",
  "He wrote letters about what he saw to scientists in London for 50 years. Microbiology begins with him.",
  ["Look closely at one ordinary thing for a long time with the best tool you can get or build. Report your observations in letters to a scientist."],
  ["letters", "mech"], "Antonie van Leeuwenhoek");
S("einstein", "physics", "Albert Einstein", "Physics after work", "Bern, Switzerland", [46.95, 7.45], "1905", 0,
  "At 26, Albert Einstein could not get a job as a scientist. He worked six days a week checking inventions at a patent office. In his spare time, in a single year, he wrote four papers that changed physics, including the theory of special relativity.",
  "His best work was a side project. He used thought experiments, like imagining riding beside a beam of light.",
  "Those papers led to modern physics, from GPS satellites to solar panels.",
  ["Choose one deep “what if” question in science. Work on it steadily in your own time and write up your reasoning with diagrams."],
  ["invent", "mathart"], "Annus mirabilis papers");
S("galaxyzoo", "citsci", "Galaxy Zoo", "A million galaxies, sorted by volunteers", "Oxford, England", [51.76, -1.25], "2007", 0,
  "Two astronomers had photos of a million galaxies and needed each one sorted by shape. It would have taken one person years. They put the photos online and asked the public for help. Within a day, volunteers were sorting tens of thousands of galaxies an hour.",
  "People are better than computers at spotting odd things. A Dutch schoolteacher, Hanny van Arkel, noticed a strange green cloud that turned out to be a new kind of object.",
  "More than 100,000 people helped in the first year. The project grew into a whole platform where anyone can help with real research.",
  ["Contribute to an online citizen science project every week for a season, then teach your class to do it."],
  ["astro", "open", "puzzle"], "Galaxy Zoo");
S("nirghin", "chem", "Kiara Nirghin", "Orange peels against drought", "Johannesburg, South Africa", [-26.20, 28.04], "2016", 16,
  "South Africa was in its worst drought in decades. Kiara Nirghin, 16, wanted a cheap way to keep water in farm soil. She experimented with waste from juice factories and found that orange peel and avocado skin could be made into a powder that soaks up and holds many times its weight in water.",
  "The usual water-holding powders are made from chemicals and cost a lot. Hers was made from food waste.",
  "She won the grand prize at the Google Science Fair and went on to study at Stanford.",
  ["Find a waste material near you and test whether it can do a useful job. Compare it fairly with what people use now."],
  ["seeds", "waste", "garden"], "Kiara Nirghin");
S("ferreira", "experiment", "Fionn Ferreira", "Magnets for microplastics", "Ballydehob, Ireland", [51.56, -9.46], "2019", 18,
  "Kayaking near his home, Fionn Ferreira saw a rock coated in oil with tiny bits of plastic stuck to it. He wondered if oil could pull plastic out of water. He mixed oil with magnetic powder, stirred it into polluted water, and pulled it out with a magnet. He built his own test equipment and ran more than a thousand tests.",
  "Microplastics are too small for ordinary filters. His method removed about 87 percent of them in his tests.",
  "He won the Google Science Fair in 2019 and has kept developing the idea.",
  ["Notice something odd outdoors and turn it into an experiment. Repeat it many times and report your success rate honestly."],
  ["water", "waste", "invent"], "Fionn Ferreira");
S("bekele", "health", "Heman Bekele", "A bar of soap against skin cancer", "Annandale, Virginia, USA", [38.83, -77.20], "2023", 14,
  "Heman Bekele was born in Ethiopia and remembered people there working all day in strong sun. Skin cancer treatment can cost thousands of dollars. At 14 he proposed a bar of soap that would carry cancer-fighting medicine into the skin, for less than ten dollars.",
  "He aimed at the people who are least able to pay for treatment.",
  "He was named America's Top Young Scientist in 2023 and TIME's Kid of the Year in 2024. The soap is still an early idea and needs years of testing before anyone could use it.",
  ["Pick a health problem that is expensive to deal with. Research it deeply and propose a low-cost approach, with an honest list of what would need testing."],
  ["experiment", "needs", "chem"], "Heman Bekele");
S("tharp", "earth", "Marie Tharp", "She mapped the bottom of the sea", "Palisades, New York, USA", [41.00, -73.91], "1952", 0,
  "In the 1950s women were not allowed on research ships. Marie Tharp stayed in the office and turned thousands of depth readings from the Atlantic into drawings by hand. She saw a deep valley running down the middle of the underwater mountains. Her colleague dismissed it at first.",
  "The valley was a crack where the sea floor is pulling apart. It was strong evidence that the continents move.",
  "Her 1977 map of the whole ocean floor is still one of the most famous maps ever drawn.",
  ["Take a pile of raw measurements nobody has drawn yet and turn them into a map or picture that shows the pattern."],
  ["maps", "sciart", "water"], "Marie Tharp");
S("foldscope", "micro", "Foldscope", "A microscope folded from paper", "Stanford, California, USA", [37.43, -122.17], "2014", 0,
  "Scientist Manu Prakash visited clinics where costly microscopes sat broken and unused. He and his student Jim Cybulski designed one that prints on a sheet of card, folds like origami, and uses a tiny glass bead for a lens. It magnifies 140 times and costs less than a dollar in parts.",
  "It can be dropped, stepped on and carried in a pocket, so science can go where labs cannot.",
  "More than a million have been sent to classrooms and field workers around the world.",
  ["Redesign an expensive tool so it costs almost nothing. Build it and prove it works."],
  ["origami", "teach", "needs"], "Foldscope");

/* ---------- INVENTION & CODE ---------- */
W("tech", "code", "Coding & Apps", "Software that does something useful or delightful for real people.", [
  "Build an app, site or game that solves a real problem for someone you know. Test it with five users and improve it.",
  "Code a tool your school could use, and hand it over with instructions."]);
W("tech", "robot", "Robotics", "Machines that sense and move.", [
  "Build a robot that does one real job, like sorting, watering or carrying. Demonstrate it live.",
  "Form a team and enter a robotics competition."]);
W("tech", "energy", "Energy & Electronics", "Circuits, batteries, wind, water and sun.", [
  "Build a working wind, water or solar generator and power something real with it.",
  "Design and solder a useful electronic device from parts, and document how it works."]);
W("tech", "assist", "Assistive Tech", "Tools that help people do what their bodies make difficult.", [
  "Interview someone with a disability about one daily frustration. Design, build and test a tool with them.",
  "Join a volunteer network that makes assistive devices and complete one for a real person."]);
W("tech", "open", "Open Source & the Web", "Things built in public and given away so others can improve them.", [
  "Write a set of clear, illustrated articles on local subjects for an open encyclopedia or a site of your own.",
  "Make something useful and publish full instructions so anyone can copy it."]);
W("tech", "invent", "Inventions", "A new device that fixes a problem you have seen up close.", [
  "Find a problem at home, school or on a farm. Build three prototypes, each better than the last, and test them.",
  "Keep an inventor's notebook for a term, then build the best idea in it."]);
W("tech", "flight", "Flight & Rockets", "Kites, gliders, balloons, drones and rockets.", [
  "Design and test a series of gliders or kites. Measure what each change does and present your best design.",
  "Launch a high-altitude balloon or model rocket with a camera or sensor and recover the data."]);

S("kamkwamba", "energy", "William Kamkwamba", "The boy who harnessed the wind", "Wimbe, Malawi", [-13.03, 33.48], "2002", 14,
  "A famine struck Malawi and William Kamkwamba's family could no longer pay his school fees. He was 14. He kept learning at a small village library, where a book showed a picture of a windmill. Using blue-gum poles, a tractor fan, a bicycle part and plastic pipe from a scrapyard, he built one beside his house.",
  "Neighbors thought he had lost his mind until the windmill lit four bulbs and charged their phones. A later one pumped water for his family's crops.",
  "A reporter wrote about him and he was invited to speak at a world conference. He returned to school, graduated from college in the United States, and now helps young inventors in Malawi.",
  ["Build a working machine that makes or saves energy, using mostly scrap. Start from a library book and a sketch.",
   "Find one daily problem your family or school has and build a device that fixes it."],
  ["library", "repair", "seeds"], "William Kamkwamba");
S("doe", "energy", "Kelvin Doe", "DJ Focus", "Freetown, Sierra Leone", [8.47, -13.23], "2009", 12,
  "The lights in Kelvin Doe's neighborhood came on about once a week. From age 12 he collected broken electronics from trash bins and taught himself how they worked. He made batteries to light nearby homes, then a generator, then a radio transmitter. He ran his own station as DJ Focus, with music, news and friends as reporters.",
  "He had no teacher and no kit. He learned by taking things apart.",
  "At 15 he became the youngest person invited to a visiting program for inventors at MIT.",
  ["Take apart broken electronics safely and learn what each part does. Build one working device from the pieces."],
  ["repair", "news", "record"], "Kelvin Doe");
S("rao", "invent", "Gitanjali Rao", "A faster test for lead in water", "Lone Tree, Colorado, USA", [39.54, -104.90], "2017", 11,
  "Gitanjali Rao saw the news about lead in the drinking water of Flint, Michigan, and watched her parents test their own water with slow, unreliable strips. At 11 she designed a small device that senses lead and sends the result to a phone. She emailed labs until one let her test the idea.",
  "A quick, cheap test would let families check their own water.",
  "She won America's top young scientist prize in 2017 and was TIME magazine's first Kid of the Year in 2020. She now runs invention workshops for students around the world.",
  ["Pick a problem from the news that makes you angry. Research how it is measured now and design a faster or cheaper way."],
  ["water", "chem", "campaign"], "Gitanjali Rao");
S("turere", "invent", "Richard Turere", "Lion Lights", "Kitengela, Kenya", [-1.47, 36.96], "2011", 11,
  "Richard Turere's Maasai family lost cattle to lions from the national park next door, and herders killed lions in return. Guarding the cows at night, he noticed that lions stayed away when he walked around with a flashlight. He wired small bulbs to a car battery, a solar panel and a turn-signal flasher so the lights blinked in a changing pattern all night.",
  "The lions thought someone was awake. The cattle were safe, and so were the lions.",
  "Neighbors asked him to build more, and his lights have since spread across Kenya and beyond.",
  ["Watch a problem between people and wildlife near you. Design a fix that protects both sides and test it."],
  ["wildlife", "energy", "smallfarm"], "Richard Turere");
S("braigo", "assist", "Shubham Banerjee", "A braille printer made of Lego", "Santa Clara, California, USA", [37.35, -121.95], "2014", 12,
  "Shubham Banerjee asked his parents how blind people read. They told him to look it up. He learned that braille printers cost about $2,000. For his seventh-grade science fair he rebuilt a Lego robotics kit into a printer that punches braille dots, for about $350.",
  "He gave the design and software away so that anyone could build one.",
  "He started a company to make a cheaper printer and became one of the youngest people ever to receive startup investment.",
  ["Take an expensive tool that people rely on. Build a working low-cost version from a kit or common parts, and publish the plans."],
  ["codes", "robot", "open"], "Braigo");
S("lachappelle", "robot", "Easton LaChappelle", "A robotic hand from Lego and fishing line", "Mancos, Colorado, USA", [37.35, -108.29], "2010", 14,
  "At 14, Easton LaChappelle built a robotic hand in his bedroom from Lego, fishing line and small motors, controlled by a glove. At a science fair he met a 7-year-old girl whose artificial arm had cost $80,000. She would outgrow it. He decided to build one for under $1,000.",
  "He taught himself 3D printing and electronics online because his small town had no classes for it.",
  "He founded a company that makes custom 3D-printed arms for children at a fraction of the usual cost.",
  ["Build a simple version of a complex machine with what you have. Then ask who needs it and improve it for one real person."],
  ["assist", "digital", "health"], "Easton LaChappelle");
S("torvalds", "open", "Linus Torvalds", "“Just a hobby”", "Helsinki, Finland", [60.17, 24.94], "1991", 0,
  "Linus Torvalds, a 21-year-old student, wrote the core of a computer operating system for fun. He posted it online with a note saying it was just a hobby and wouldn't be big. He invited anyone to improve it and share their changes.",
  "Thousands of volunteers joined in. Nobody owned it, so everybody could build on it.",
  "Linux now runs most of the internet, every Android phone, and all 500 of the world's fastest supercomputers.",
  ["Start a project in public and invite others to improve it. Keep a record of every contribution."],
  ["code", "team"], "History of Linux");
S("bernerslee", "open", "Tim Berners-Lee", "“Vague, but exciting”", "Geneva, Switzerland", [46.23, 6.05], "1989", 0,
  "Tim Berners-Lee worked at a physics lab where scientists kept losing track of each other's information. He wrote a proposal for linking documents across computers. His boss wrote “Vague, but exciting” on it and let him try. He built the first web browser and web server himself.",
  "He and the lab then gave the invention away for free, so anyone could make a website without asking permission.",
  "That side project is the World Wide Web.",
  ["Find a place where information keeps getting lost at your school. Design and build a system that connects it."],
  ["code", "library"], "History of the World Wide Web");
S("wikipedia", "open", "Wikipedia", "An encyclopedia written by volunteers", "San Diego, California, USA", [32.72, -117.16], "2001", 0,
  "In 2001 a small team launched an encyclopedia that anyone could edit. Experts said it would fill with nonsense. Volunteers wrote articles, checked each other's facts, argued about wording and fixed vandalism, mostly within minutes.",
  "It showed that strangers who share rules and care about getting it right can build something huge with no pay.",
  "It now has tens of millions of articles in more than 300 languages. It is still written by volunteers, so it still contains mistakes worth checking.",
  ["Improve or write articles about local places, people or species on an open wiki. Cite a source for every fact."],
  ["news", "language", "museum"], "History of Wikipedia");
S("scratch", "code", "Scratch", "Coding that snaps together like bricks", "Cambridge, Massachusetts, USA", [42.36, -71.09], "2007", 0,
  "A research group led by Mitchel Resnick wanted children to make their own games and stories, not only play other people's. They built Scratch, where code blocks snap together like Lego. Every project is shared with its code visible, so anyone can look inside and remix it.",
  "Kids taught each other. The site became a place to learn by borrowing and improving.",
  "More than 100 million people have joined, and over a billion projects have been made.",
  ["Build a game or interactive story, publish it, and improve it using feedback from players."],
  ["video", "anim", "teach"], "Scratch programming language");
S("bemyeyes", "assist", "Be My Eyes", "Lending your eyes for a minute", "Copenhagen, Denmark", [55.68, 12.57], "2015", 0,
  "Hans Jørgen Wiberg, a Danish craftsman who is losing his sight, knew that blind people often need a pair of eyes for just a moment: to read a label or check an oven dial. He proposed an app that connects them by video call with a sighted volunteer.",
  "It turned a few spare minutes from millions of strangers into real independence.",
  "Millions of volunteers in more than 150 countries have signed up to help.",
  ["Design a way for people at school to lend each other small bits of help quickly. Run it for a month and measure how it's used."],
  ["kind", "include", "code"], "Be My Eyes");
S("enable", "assist", "e-NABLE", "3D-printed hands from strangers", "Bellingham, Washington, USA", [48.75, -122.48], "2012", 0,
  "Ivan Owen made a mechanical hand for a costume and posted a video. A carpenter in South Africa who had lost his fingers saw it and wrote to him. Working 10,000 miles apart, they designed a working hand, then one for a 5-year-old boy. They published the design for free.",
  "Volunteers with 3D printers began making hands for children near them, who outgrow costly ones quickly.",
  "The volunteer network has delivered thousands of free hands and arms in more than 100 countries.",
  ["Join an open-design community. Build one of their devices for a real person and suggest an improvement."],
  ["digital", "open", "comfort"], "e-NABLE prosthetics");
S("lamarr", "invent", "Hedy Lamarr", "A film star's secret invention", "Hollywood, California, USA", [34.10, -118.33], "1942", 0,
  "Hedy Lamarr was a famous film actress who spent her evenings inventing. During World War II she and composer George Antheil designed a way to stop enemies from jamming radio signals. The signal would hop between 88 frequencies in a secret pattern, kept in step by rolls like the ones in a player piano.",
  "The idea came from joining two things nobody else had put together: radio and a self-playing piano.",
  "The navy ignored the patent for years. The same family of ideas is now used in wireless technology such as Bluetooth.",
  ["Combine two of your interests that seem unrelated into one invention or artwork. Explain what each one brought."],
  ["band", "puzzle", "film"], "Hedy Lamarr");
S("afghan", "robot", "Afghan Girls Robotics Team", "The Afghan Dreamers", "Herat, Afghanistan", [34.35, 62.20], "2017", "Teens",
  "A team of teenage girls from Herat built a ball-sorting robot for a world competition. Their parts were held up at customs for months, and their travel visas were refused twice. After people around the world objected, they were allowed to travel and compete.",
  "They competed in a place and time where many girls were not allowed to study at all.",
  "They won a medal for courage. In 2020 they built a low-cost breathing machine from used car parts for their city's hospitals.",
  ["Form a team and enter a robotics or engineering contest. Document every setback and how you got past it."],
  ["rights", "team", "health"], "Afghan Girls Robotics Team");
S("wright", "flight", "The Wright brothers", "Bicycle makers who learned to fly", "Dayton, Ohio, USA", [39.76, -84.19], "1903", 0,
  "Wilbur and Orville Wright ran a bicycle shop and never finished high school. When their gliders didn't fly as the published numbers predicted, they built a small wind tunnel in the shop and tested about 200 wing shapes themselves.",
  "Better-funded teams were guessing. The brothers measured, then trusted their own data over the experts.",
  "On December 17, 1903, their airplane flew for 12 seconds. Within a few years they were flying for more than an hour.",
  ["Build a test rig, like a wind tunnel or ramp, and use it to improve a design through many measured trials."],
  ["experiment", "mech", "kidbiz"], "Wright brothers");
S("farnsworth", "invent", "Philo Farnsworth", "Television, sketched at 14", "Rigby, Idaho, USA", [43.67, -111.91], "1921", 14,
  "Philo Farnsworth was born in a log cabin near Beaver, Utah. At 14, plowing a field in Idaho in straight back-and-forth rows, he realized a picture could be sent the same way: scanned line by line with a beam of electrons. He drew the idea on the blackboard for his chemistry teacher.",
  "Others were trying to build television with spinning mechanical discs. His all-electronic idea was the one that worked.",
  "At 21 he sent the first electronic TV image. Years later his teacher's memory of that blackboard sketch helped him win his patent case against a giant company.",
  ["Keep a dated inventor's notebook. Sketch every idea, pick one and build a model that shows how it would work."],
  ["physics", "film", "smallfarm"], "Philo Farnsworth");
S("moser", "energy", "Alfredo Moser's bottle light", "A lamp made of water", "Uberaba, Brazil", [-19.75, -47.93], "2002", 0,
  "During power cuts in his town, mechanic Alfredo Moser filled a clear plastic bottle with water and a little bleach and fixed it through a hole in his workshop roof. Sunlight bent through the water and lit the room about as well as an electric bulb. It cost almost nothing.",
  "Millions of people live in windowless homes that are dark even at noon and can't afford to run lights all day.",
  "A group in the Philippines spread the idea as Liter of Light. Hundreds of thousands of homes in many countries now use bottle lights.",
  ["Find a simple physics trick that could replace something costly. Build it, measure how well it works, and teach others to make it."],
  ["physics", "needs", "waste"], "Liter of Light");
S("makosinski", "energy", "Ann Makosinski", "A flashlight powered by your hand", "Victoria, British Columbia, Canada", [48.43, -123.37], "2013", 15,
  "A friend of Ann Makosinski's in the Philippines failed a grade because she had no light to study by at night. Ann, 15, knew that some tiles make electricity when one side is warmer than the other. She built a hollow flashlight that runs on the heat of the hand holding it, with no batteries.",
  "She started from one friend's problem and from parts she had been tinkering with since she was small.",
  "She won her age group at the Google Science Fair in 2013.",
  ["Ask a friend or relative far away what small thing makes their day harder. Design something to fix it."],
  ["physics", "letters", "experiment"], "Ann Makosinski");

/* ---------- MAKING & BUILDING ---------- */
W("make", "wood", "Woodworking", "Furniture, boats, tools and toys from timber.", [
  "Build a piece of furniture the school needs, to a standard a carpenter would accept.",
  "Build a boat, sled or cart that carries you, and take it on a real journey."]);
W("make", "textile", "Sewing, Knitting & Quilting", "Cloth and yarn made into things people wear, use and keep.", [
  "Sew or knit a set of items for people who need them and deliver them yourself.",
  "Make a quilt that tells a story, with squares from many people."]);
W("make", "arch", "Architecture & Shelters", "Designing spaces that keep people safe, cool, warm or together.", [
  "Design and build a small structure for the school grounds: a reading hut, a bird hide, a shade shelter.",
  "Draw plans and build a scale model for a building your community needs. Present it to people who could build it."]);
W("make", "cardboard", "Cardboard & Recycled Builds", "Big ideas built from boxes, tape and things headed for the bin.", [
  "Build an arcade, maze or playable machine from cardboard and open it to the public for a day.",
  "Set up a small workshop that turns one waste material into useful objects."]);
W("make", "repair", "Repair & Restoration", "Bringing broken or forgotten things back to working life.", [
  "Run a repair event where volunteers fix neighbors' broken things. Count what you saved from the landfill.",
  "Restore one old object, like a bike, a radio or a piece of furniture, and document every step."]);
W("make", "clay", "Ceramics", "Earth shaped and fired into things that last thousands of years.", [
  "Dig or source local clay, test it, and make a set of pots or tiles from it.",
  "Make a set of bowls or mugs for a community meal and serve the meal in them."]);
W("make", "mech", "Clocks & Mechanisms", "Gears, levers, marbles and springs doing something precise.", [
  "Build a working clock, automaton or marble machine and explain every part.",
  "Design a chain-reaction machine with at least 15 steps that completes a simple task."]);
W("make", "bridge", "Bridges & Big Structures", "Spanning a gap or building tall.", [
  "Design and build a footbridge, tower or dome that holds real weight. Test it in public.",
  "Build scale models of three bridge types and find out which carries the most."]);
W("make", "fashion", "Fashion & Costume", "Clothing designed to say something.", [
  "Design and sew a small collection from second-hand fabric and show it at a real event.",
  "Make the costumes for a school play from scratch."]);

S("caine", "cardboard", "Caine's Arcade", "A cardboard arcade and a flash mob", "East Los Angeles, USA", [34.03, -118.21], "2011", 9,
  "Caine Monroy, 9, spent his summer vacation building an arcade from cardboard boxes in his dad's used auto parts shop. He made a basketball game, a claw machine with a hook on a string, and prizes. A Fun Pass cost $2 for 500 plays. Hardly anyone came. A filmmaker who stopped to buy a door handle became his first customer.",
  "The filmmaker secretly invited the whole city to surprise Caine with a crowd, and made a short film about that day.",
  "The film was watched millions of times. Viewers gave more than $240,000 toward Caine's college, and children in many countries now hold a cardboard challenge every year.",
  ["Build something elaborate that people can play, from boxes and tape. Open it to the public, and keep improving it as people use it.",
   "Find a kid or neighbor who has made something wonderful that nobody has noticed. Tell their story on film."],
  ["board", "kidbiz", "doc"], "Caine's Arcade");
S("kere", "arch", "Francis Kéré", "A school built by its village", "Gando, Burkina Faso", [11.78, -0.36], "2001", 0,
  "Francis Kéré was the first child from his village to go to school, in a hot, dark classroom far from home. He later studied architecture in Germany and raised money while still a student to build a school in Gando. The whole village made the clay bricks. A raised roof lets hot air escape so the rooms stay cool without electricity.",
  "He used local materials and the villagers' own hands, so they could repair and extend it themselves.",
  "The school grew from 120 students to many hundreds. In 2022 he became the first African to win architecture's highest prize.",
  ["Design a small building for your own climate that stays comfortable without power. Build a model and test its temperature."],
  ["clay", "teach", "physics"], "Diébédo Francis Kéré");
S("ban", "arch", "Shigeru Ban", "Shelters made of paper tubes", "Kobe, Japan", [34.69, 135.20], "1995", 0,
  "Architect Shigeru Ban saw refugees shivering under plastic sheets and offered the United Nations a design using strong cardboard tubes. After a huge earthquake in Kobe, he and volunteers built paper-tube houses on beer crates filled with sand, and a paper church.",
  "Paper tubes are cheap, easy to find, simple to put up and recyclable. People got dignity and privacy within days.",
  "He has built disaster shelters in many countries for free and won architecture's highest prize in 2014.",
  ["Design an emergency shelter from one cheap material. Build it full size and spend a night in it."],
  ["cardboard", "needs", "outdoor"], "Shigeru Ban");
S("jonah", "textile", "Jonah Larson", "Crochet for the place he was born", "La Crosse, Wisconsin, USA", [43.80, -91.24], "2013", 5,
  "Jonah Larson was adopted from Ethiopia as a baby. At five he found a crochet hook in a bag of craft supplies and learned from online videos. By 11 he was turning out blankets, hats and stuffed animals at high speed, and his work became famous. Orders poured in faster than he could fill them.",
  "He used the attention to raise money for the region of Ethiopia where he was born.",
  "His fundraising has helped pay for a library and a science lab for schools there.",
  ["Get very good at one craft. Sell or auction what you make to pay for something specific that a community needs."],
  ["kidbiz", "fundraise", "library"], "Jonah Larson crochet");
S("geesbend", "textile", "The quilters of Gee's Bend", "Work clothes into masterpieces", "Boykin, Alabama, USA", [32.07, -87.28], "1800s to today", 0,
  "Gee's Bend is a small Black community almost surrounded by a river. For generations, women there sewed quilts from worn-out work clothes and feed sacks to keep their families warm. They made up bold patterns of their own and taught their daughters.",
  "They made beautiful things from what they had, for people they loved. Nobody was thinking about museums.",
  "In 2002 their quilts were shown in major art museums, and critics called them some of the finest modern art made in America.",
  ["Make a quilt from clothes that mean something to your family or class. Record the story of every piece."],
  ["oral", "tradition", "paint"], "Quilts of Gee's Bend");
S("repaircafe", "repair", "Repair Café", "Bring it broken, fix it together", "Amsterdam, Netherlands", [52.37, 4.90], "2009", 0,
  "Journalist Martine Postma was bothered by how much people throw away that could be fixed. She set up tables in a theater lobby, invited neighbors who were good with tools, and told everyone to bring their broken toasters, lamps, bikes and trousers.",
  "People learned to fix their own things and met neighbors with skills they never knew about.",
  "There are now thousands of Repair Cafés around the world.",
  ["Organize a repair day at school with skilled volunteers. Log every item fixed and the weight kept out of the trash."],
  ["waste", "local", "elders"], "Repair Café");
S("precious", "cardboard", "Precious Plastic", "Recycling machines anyone can build", "Eindhoven, Netherlands", [51.44, 5.47], "2013", 0,
  "For his final project at design school, Dave Hakkens built small machines that shred plastic waste, melt it and press it into new objects like bowls, tiles and beams. He put the blueprints online for free.",
  "Recycling had been something only big factories did. Now a workshop or school could do it.",
  "People have set up hundreds of small plastic recycling workshops around the world using his plans.",
  ["Set up a small system that turns one kind of waste at school into something people want."],
  ["waste", "open", "social"], "Precious Plastic");
S("harrison", "mech", "John Harrison", "The carpenter who solved longitude", "Barrow upon Humber, England", [53.68, -0.38], "1730–1773", 0,
  "Ships were being lost because sailors couldn't tell how far east or west they were. The answer needed a clock that kept perfect time on a rolling ship, which the best scientists thought impossible. John Harrison, a self-taught carpenter, spent about forty years building four clocks, each better than the last.",
  "His fourth, the size of a large pocket watch, lost only five seconds on a voyage of 81 days.",
  "The experts kept refusing to pay him the prize. He got his reward at age 80, and his clocks made sea travel far safer.",
  ["Pick one thing to build and make four versions over the project, each fixing the faults of the one before."],
  ["voyage", "physics", "wood"], "John Harrison");
S("walsh", "bridge", "Homan Walsh", "The kite that started a bridge", "Niagara Falls, USA and Canada", [43.11, -79.06], "1848", 16,
  "Engineers wanted to build the first bridge across the Niagara Gorge, 800 feet wide with rapids below, but could not get the first line across. They offered a cash prize to any boy who could fly a kite to the other side. Homan Walsh, 16, crossed by ferry and flew his kite, the Union, from the Canadian cliffs. The string snapped. River ice then stranded him there for eight days.",
  "He repaired the kite and tried again. The second time the string held.",
  "Workers used his string to pull across a cord, then a rope, then a cable. The bridge opened that summer.",
  ["Solve a real engineering problem with a kite, balloon or other simple flying thing. Keep trying after the first attempt fails."],
  ["flight", "newsport", "invent"], "Homan Walsh");
S("martinez", "clay", "Maria Martinez", "Rediscovering black pottery", "San Ildefonso Pueblo, New Mexico, USA", [35.89, -106.12], "1910s", 0,
  "Archaeologists found pieces of shiny black pottery near San Ildefonso Pueblo, and nobody remembered how it was made. Potter Maria Martinez and her husband Julian experimented for years. They discovered that smothering the fire turned the red clay black, and worked out how to paint matte designs on the polished surface.",
  "She shared the method freely with her neighbors when she could have kept it secret.",
  "Pottery became the pueblo's main living, and her pots are now in museums around the world.",
  ["Find a craft skill that is disappearing where you live. Learn it from someone who knows it, or work it out by experiment, and teach it on."],
  ["dig", "tradition", "chem"], "Maria Martinez potter");

/* ---------- GAMES, PUZZLES & NUMBERS ---------- */
W("games", "board", "Board & Card Games", "Rules, pieces and a reason to play again.", [
  "Design a board game that teaches something real. Playtest it with 20 people and revise the rules three times.",
  "Make a card game about local history or wildlife and print a proper edition."]);
W("games", "video", "Video Games", "Worlds with rules that players explore.", [
  "Make a complete small video game with three levels and release it for classmates to play.",
  "Rebuild a real place or historic site inside a building game and give guided tours."]);
W("games", "puzzle", "Puzzles & Word Games", "Problems made to be enjoyed.", [
  "Create a daily puzzle and publish it for a month. Track how many people play.",
  "Design an escape room or puzzle hunt for another class."]);
W("games", "chess", "Chess & Strategy", "Games of pure thinking.", [
  "Start a chess or strategy club, teach beginners, and run a tournament.",
  "Train seriously for a real tournament and analyze every game you play."]);
W("games", "mathart", "Math & Patterns", "Shapes, numbers and patterns explored for their own sake.", [
  "Explore one pattern deeply, like tessellations, fractals or knots. Make large artworks that show how it works.",
  "Collect and solve 30 great math puzzles, then run a math festival for younger students."]);
W("games", "origami", "Origami & Paper Folding", "Flat sheets folded into almost anything.", [
  "Design your own origami models and write the folding diagrams so others can follow.",
  "Fold a large installation with help from the whole school."]);
W("games", "magic", "Magic & Illusions", "Performing the impossible and understanding why it fools us.", [
  "Build and rehearse a 10-minute magic act and perform it for an audience.",
  "Study optical illusions and build an illusion room that people can walk through."]);

S("magie", "board", "Lizzie Magie", "The game behind Monopoly", "Brentwood, Maryland, USA", [38.94, -76.96], "1904", 0,
  "Lizzie Magie wanted people to feel how rent can make landowners rich and everyone else poor. She invented The Landlord's Game, with properties around a square board. It had two sets of rules. In one, a single player ends up owning everything. In the other, everyone gains when wealth is created.",
  "She used play to let people test an argument about fairness for themselves.",
  "Homemade copies spread for 30 years. A man sold a version as Monopoly in 1935 and grew rich. She received $500, and her role was forgotten for decades.",
  ["Design a game that lets players experience a real issue from the inside. Write two rule sets and compare how each one feels."],
  ["debate", "loans", "rights"], "The Landlord's Game");
S("tetris", "video", "Tetris", "A puzzle that stopped the office", "Moscow, Russia", [55.75, 37.62], "1984", 0,
  "Alexey Pajitnov was a computer researcher who loved a wooden puzzle made of shapes. In his spare time he wrote a game where shapes fall and players fit them into rows. His computer had no graphics, so he drew the blocks with brackets. Coworkers copied it and work stopped across the building.",
  "The rules take seconds to learn and the game is nearly impossible to put down.",
  "Tetris spread around the world on floppy disks and became one of the best-selling games ever. He earned nothing from it for over ten years.",
  ["Turn a physical puzzle or playground game you love into a computer game. Keep the rules to one sentence."],
  ["puzzle", "code", "mathart"], "Tetris");
S("wordle", "puzzle", "Wordle", "A game made as a gift", "Brooklyn, New York, USA", [40.68, -73.97], "2021", 0,
  "Josh Wardle's partner loved word games, so he made one just for her: guess a five-letter word in six tries, one puzzle a day. She helped by sorting 12,000 words down to the ones most people know. They played it for months with their family.",
  "It had no ads and asked for only a few minutes a day. Players could share results without spoiling the answer.",
  "He put it online in late 2021. Ninety people played on November 1, and millions were playing two months later.",
  ["Make a small daily game for one specific person you care about. Then share it and see who else plays."],
  ["code", "kind", "letters"], "Wordle");
S("pokemon", "video", "Satoshi Tajiri", "Bug collecting becomes Pokémon", "Machida, Japan", [35.55, 139.44], "1982", 17,
  "As a boy, Satoshi Tajiri collected insects in the fields and ponds near his home, and friends called him Dr. Bug. The fields were paved over as the city grew. At 17 he started a hand-stapled game magazine with a friend who drew the pictures. Later they spent six years making a game about catching and trading creatures.",
  "He wanted city children to feel what he had felt hunting for bugs and swapping them with friends.",
  "Pokémon came out in 1996 and became one of the most popular game series in history.",
  ["Turn something you loved doing outdoors into a game other people can play. Start with a paper version."],
  ["wildlife", "zine", "sciart"], "Satoshi Tajiri");
S("rubik", "puzzle", "Ernő Rubik", "A teaching model nobody could solve", "Budapest, Hungary", [47.50, 19.04], "1974", 0,
  "Ernő Rubik taught design and wanted a model to help students think about movement in three dimensions. He built a cube from wooden blocks whose faces could turn without the cube falling apart. Then he scrambled it and realized he had no idea how to get it back. It took him about a month.",
  "He had made a puzzle with 43 quintillion positions and only one solution, and it fits in a hand.",
  "Hundreds of millions of cubes have been sold. Today's fastest solvers finish in under four seconds.",
  ["Build a physical model to explain a hard idea. Notice if it becomes a puzzle, then design challenges for it."],
  ["mech", "mathart", "wood"], "Rubik's Cube");
S("tani", "chess", "Tani Adewumi", "A champion from a shelter", "New York City, USA", [40.75, -73.98], "2019", 8,
  "Tani Adewumi's family fled Nigeria and lived in a New York homeless shelter. He learned chess at his school's club, where the coach waived the fee, and practiced for hours on the shelter floor. About a year after learning the game, at 8, he won the New York State championship for his age group.",
  "He practiced more than anyone else and had a coach and a mother who made sure he could get to the club.",
  "Strangers donated enough for a home. The family used much of the money to help other newcomers. Tani became a national master at 10.",
  ["Take up a hard game or skill as a beginner. Train on a schedule, enter real competitions, and chart your progress."],
  ["team", "include", "teach"], "Tanitoluwa Adewumi");
S("samaira", "board", "Samaira Mehta", "A board game that teaches coding", "Santa Clara, California, USA", [37.35, -121.97], "2015", 7,
  "Samaira Mehta learned to code at six and wanted her friends to enjoy it too. In second grade she designed CoderBunnyz, a board game where players move bunnies using the ideas programmers use, like sequences and loops. She tested it on other kids and kept fixing it.",
  "She explained something hard in a form her friends wanted to play.",
  "She has run workshops for thousands of children and made more games, including one about artificial intelligence.",
  ["Design a game that teaches a skill you have to people who find it scary. Run workshops with it."],
  ["code", "teach", "kidbiz"], "Samaira Mehta");
S("lang", "origami", "Robert Lang", "Origami for telescopes and airbags", "Alamo, California, USA", [37.85, -122.03], "2001", 0,
  "Robert Lang was a laser physicist who had folded paper since he was six. He worked out the mathematics of origami and wrote software that can design the folds for almost any shape. In 2001 he left his job to fold full time.",
  "The same math answers real engineering questions about packing something big into a small space.",
  "He has helped design a folding space telescope lens and worked out how car airbags should fold.",
  ["Find where a hobby of yours overlaps with a real engineering problem. Build a model that shows the connection."],
  ["mathart", "astro", "invent"], "Robert J. Lang");
S("mirzakhani", "mathart", "Maryam Mirzakhani", "Mathematics by doodling", "Tehran, Iran", [35.70, 51.42], "1990s", 0,
  "As a child, Maryam Mirzakhani wanted to be a writer and did poorly in math one year. A few years later she won gold medals for Iran at the world math contest for students. As a mathematician she worked slowly, drawing the same curved surfaces again and again on huge sheets of paper on the floor. Her daughter called it painting.",
  "She described math as being lost in a jungle and using everything you know to find a new trick.",
  "In 2014 she became the first woman to win the Fields Medal, the highest prize in mathematics.",
  ["Stay with one hard problem for weeks. Keep every drawing and wrong turn, and present the path as well as the answer."],
  ["paint", "puzzle", "fiction"], "Maryam Mirzakhani");

/* ---------- NATURE & EARTH ---------- */
W("nature", "trees", "Trees & Forests", "Planting, tending and protecting woods, one seedling at a time.", [
  "Plant a small native grove at school and care for it through its first year. Count how many trees survive.",
  "Map and measure the big trees in your town and make a guide to them."]);
W("nature", "water", "Oceans, Rivers & Water", "Keeping water clean and the life in it healthy.", [
  "Adopt a stretch of stream. Test it monthly, clean it, and report the results to the people responsible for it.",
  "Trace where your tap water comes from and where it goes. Make a map or film of the journey."]);
W("nature", "wildlife", "Wildlife & Habitats", "Making room for wild animals to live near people.", [
  "Restore habitat for one local species and monitor whether it shows up.",
  "Set up trail cameras and produce a guide to who shares your land."]);
W("nature", "pollin", "Pollinators & Wild Gardens", "Bees, butterflies, moths and the plants they need.", [
  "Plant a pollinator garden with native flowers and count the visitors through the season.",
  "Build and place bee hotels, then study which designs get used."]);
W("nature", "birds", "Birds", "Counting, feeding, housing and learning them by ear.", [
  "Run a bird count at school every week for a term and submit the data to a national project.",
  "Build nest boxes for a local species and monitor them through nesting season."]);
W("nature", "waste", "Waste & Recycling", "Dealing with what people throw away.", [
  "Audit your school's trash for a week. Design a change and measure the difference a month later.",
  "Turn one kind of waste into a product and find people who want it."]);
W("nature", "climate", "Climate Action", "Measuring and reducing the impact people have on the atmosphere.", [
  "Measure your school's energy use and lead one change that cuts it. Report the numbers before and after.",
  "Research one climate question that people argue about. Present the strongest evidence on each side."]);
W("nature", "sky", "Night Skies", "Protecting the dark so people and animals can see the stars.", [
  "Measure how dark the sky is at ten places in your valley and make a map of light pollution.",
  "Work with neighbors or a business to change one set of outdoor lights so they point down."]);
W("nature", "trails", "Trails & Wild Places", "Paths that let people into nature without wrecking it.", [
  "Build or restore a section of trail with a land manager and make a guide to it.",
  "Create a nature trail at school with signs you research and write."]);

S("maathai", "trees", "Wangari Maathai", "The Green Belt Movement", "Nairobi, Kenya", [-1.29, 36.82], "1977", 0,
  "Rural women told Wangari Maathai, a scientist, that their streams were drying up and they had to walk farther each year for firewood. She proposed planting trees. She began with seven seedlings in a Nairobi park, then helped women's groups start nurseries. They were paid a small amount for each tree that survived.",
  "Trees held the soil and water, and the work gave women income and a voice. She was arrested more than once for defending parks and forests.",
  "The movement has planted more than 50 million trees. In 2004 she became the first African woman to win the Nobel Peace Prize.",
  ["Start a tree nursery from local seed. Give or sell the seedlings and track which ones are alive a year later."],
  ["rights", "social", "seeds"], "Wangari Maathai");
S("payeng", "trees", "Jadav Payeng", "One man plants a forest", "Majuli, Assam, India", [26.95, 94.17], "1979", 0,
  "After a flood, a young man named Jadav Payeng found snakes that had died of heat on a bare sandbar in the Brahmaputra River. No trees gave them shade. He planted bamboo there, then other trees, and went back to water and plant nearly every day for more than forty years.",
  "He did it alone and without telling anyone, on land everyone else had written off.",
  "The forest now covers about 550 hectares, bigger than New York's Central Park. Elephants, tigers and rhinos live in it.",
  ["Pick one small piece of worn-out ground and care for it steadily all year. Document it with a photo from the same spot each week."],
  ["wildlife", "landart", "photo"], "Jadav Payeng");
S("felix", "trees", "Felix Finkbeiner", "Plant-for-the-Planet", "Bavaria, Germany", [47.91, 11.17], "2007", 9,
  "For a fourth-grade report on climate, Felix Finkbeiner read about Wangari Maathai. He ended his talk by saying children could plant a million trees in every country. His class planted the first one at school. Other schools joined, and at 13 he spoke at the United Nations.",
  "A school report turned into a children's movement in dozens of countries.",
  "The group reported a million trees by 2011. Later, reporters found that some of its tree numbers could not be checked and that nobody had counted how many seedlings survived. It brought in outside experts to audit its work.",
  ["Start a planting project, and count honestly. Record every tree, check survival after six months, and publish the real numbers even if they are disappointing."],
  ["campaign", "experiment", "climate"], "Plant-for-the-Planet");
S("greta", "climate", "Greta Thunberg", "A school strike of one", "Stockholm, Sweden", [59.33, 18.07], "2018", 15,
  "On August 20, 2018, 15-year-old Greta Thunberg sat down outside the Swedish parliament with a hand-painted sign that read “School strike for climate.” On the first day she sat alone. She came back each school day until the election, then every Friday.",
  "Students in other cities and countries started doing the same. Within a year, climate marches drew millions of people in about 150 countries.",
  "She has spoken to world leaders and was TIME's Person of the Year in 2019. People still disagree about her methods and about what should be done. Few would dispute that one teenager with a sign got the world talking.",
  ["Choose an issue you have studied carefully. Find a peaceful, visible way to keep it in front of decision makers week after week.",
   "Interview people who disagree about a big issue and present each view fairly."],
  ["campaign", "schoolvoice", "debate"], "Greta Thunberg");
S("slat", "water", "Boyan Slat", "The Ocean Cleanup", "Delft, Netherlands", [52.01, 4.36], "2011", 16,
  "On a diving trip in Greece at 16, Boyan Slat saw more plastic bags than fish. For a school project he designed a floating barrier that would let ocean currents gather plastic. At 18 he left university to build it. The first full-size system broke apart at sea and lost what it had caught.",
  "His team published what went wrong, redesigned it, and tried again several times. They also built barges that catch trash in rivers before it reaches the sea.",
  "By 2026 they had removed more than 60 million kilograms of trash from oceans and rivers.",
  ["Design a device that collects one kind of pollution. Test it, report honestly on what failed, and build a second version."],
  ["invent", "waste", "social"], "The Ocean Cleanup");
S("wijsen", "waste", "Melati and Isabel Wijsen", "Bye Bye Plastic Bags", "Bali, Indonesia", [-8.65, 115.22], "2013", "Ages 10 and 12",
  "After a school lesson about people who changed the world, sisters Melati, 12, and Isabel, 10, asked what they could do in Bali right now. Plastic bags were washing up on every beach. They started beach cleanups, gave talks, handed out reusable bags and collected signatures at the airport.",
  "They kept at it for years until they got a meeting with the governor, who promised to act.",
  "Their petition reached 100,000 signatures. Bali banned single-use plastic bags, and one of their cleanups drew 20,000 people.",
  ["Pick one specific rule you want changed where you live. Gather evidence and signatures, and ask for a meeting with the person who decides."],
  ["law", "campaign", "water"], "Bye Bye Plastic Bags");
S("shah", "water", "Afroz Shah", "The Versova beach cleanup", "Mumbai, India", [19.13, 72.81], "2015", 0,
  "Lawyer Afroz Shah moved to a flat overlooking Versova beach and found it buried under trash, in places as deep as his shoulders. He and an 84-year-old neighbor started picking it up by hand one Sunday. They came back every weekend, and people began to join them.",
  "He didn't wait for the city. Thousands of volunteers followed two people with gloves.",
  "The United Nations called it the world's largest beach cleanup. In 2018, sea turtle hatchlings were seen on the beach for the first time in about twenty years.",
  ["Pick one place and clean it on a fixed schedule for two months. Recruit helpers and weigh everything you remove."],
  ["local", "wildlife", "elders"], "Afroz Shah");
S("peltier", "water", "Autumn Peltier", "Water protector", "Wiikwemkoong, Ontario, Canada", [45.80, -81.72], "2012", 8,
  "At a water ceremony when she was eight, Autumn Peltier saw signs warning people not to drink the tap water in a First Nations community. She learned that many communities had lived this way for years. She began speaking about clean water, as her great-aunt had before her.",
  "At 12 she told Canada's prime minister, face to face, that she was unhappy with his choices. At 13 she spoke at the United Nations.",
  "At 14 she was named Chief Water Commissioner for the Anishinabek Nation, speaking for 39 First Nations.",
  ["Learn where your community's water comes from and who looks after it. Speak about what you find to the people in charge."],
  ["campaign", "tradition", "rights"], "Autumn Peltier");
S("cbc", "birds", "The Christmas Bird Count", "Counting birds since 1900", "New York City, USA", [40.78, -73.97], "1900", 0,
  "A popular Christmas tradition used to be a contest to shoot as many birds as possible. In 1900 bird scientist Frank Chapman proposed counting them instead. That first year, 27 people in 25 places counted about 18,500 birds.",
  "The count has been repeated every winter since, so it now shows how bird numbers and ranges have changed over more than a century.",
  "More than 70,000 volunteers now count birds at over 2,000 locations each year.",
  ["Start an annual count of something living at your school. Design it so future classes can repeat it exactly and compare."],
  ["citsci", "tradition", "experiment"], "Christmas Bird Count");
S("roots", "wildlife", "Roots & Shoots", "Twelve teenagers on Jane Goodall's porch", "Dar es Salaam, Tanzania", [-6.79, 39.21], "1991", "Teens",
  "Twelve Tanzanian teenagers came to see chimpanzee scientist Jane Goodall at her home. They were worried about problems they saw around them and felt no one would listen. She helped them form groups that each choose three projects: one for people, one for animals, one for the environment.",
  "The idea is that young people pick the problems themselves and act close to home.",
  "Roots & Shoots groups now work in dozens of countries. Goodall kept traveling to meet them until her death in 2025 at age 91.",
  ["Form a small group and complete three linked projects: one that helps people, one for animals and one for the land."],
  ["team", "kind", "campaign"], "Roots & Shoots");
S("darksky", "sky", "North Fork Park", "A dark-sky park in Ogden Valley", "Liberty, Utah, USA", [41.37, -111.90], "2015", 0,
  "Most Americans can no longer see the Milky Way from home. Janet Muir of Ogden led volunteers who wanted to protect the night sky over North Fork Park. With the county, a university and the local astronomy club, they measured the darkness, changed light fixtures and wrote the application.",
  "More than two million people live within a couple of hours of the park, so they had to show that a dark sky can be protected near cities.",
  "In 2015 it was named an International Dark Sky Park, the first in the world at its level and only the second county park ever to qualify.",
  ["Measure the night sky where you live and find the brightest wasted light. Persuade its owner to shield it, then measure again."],
  ["astro", "local", "law"], "North Fork Park Utah dark sky");
S("rainforest", "wildlife", "The Children's Eternal Rainforest", "A class buys a forest", "Monteverde, Costa Rica", [10.30, -84.75], "1987", "A primary class",
  "A biologist visited a small primary school in Sweden and told the class that rainforests were being cut down. The children asked their teacher, Eha Kern, what they could do. They raised money and sent it to Costa Rica to buy forest so it could never be cleared.",
  "Children in other schools and countries heard about it and joined in.",
  "The reserve now protects about 23,000 hectares of forest, home to jaguars, tapirs and hundreds of kinds of birds.",
  ["Find a piece of land or habitat that can be protected for a known price. Raise the money as a class and report exactly what it bought."],
  ["fundraise", "letters", "trees"], "Children's Eternal Rainforest");
S("at", "trails", "The Appalachian Trail", "A footpath built by volunteers", "Georgia to Maine, USA", [39.32, -77.73], "1921", 0,
  "In 1921 a forester named Benton MacKaye wrote an article proposing a walking trail along the whole Appalachian mountain range. Hiking clubs took up the idea. Volunteers scouted routes, cut brush and painted markers on weekends for sixteen years.",
  "No government ordered it. Ordinary people built it because they wanted it to exist.",
  "The trail runs about 2,190 miles through 14 states. Volunteer clubs still maintain it.",
  ["Propose a route that connects places people care about. Build the first section and write the guide."],
  ["outdoor", "exped", "maps"], "Appalachian Trail");
S("ceesay", "waste", "Isatou Ceesay", "Purses from plastic bags", "Njau, The Gambia", [13.75, -15.20], "1997", 0,
  "Plastic bags were piling up in Isatou Ceesay's village. Goats ate them and died, and rainwater collected in them and bred mosquitoes. She and four friends washed the bags, cut them into strips and crocheted the strips into purses. Neighbors laughed at them for handling trash.",
  "The purses sold. The women earned their own money and the village got cleaner.",
  "The group grew to train thousands of people, and The Gambia later banned plastic bags.",
  ["Turn a waste material into something people will pay for. Keep accounts and decide what the earnings will fund."],
  ["textile", "social", "kidbiz"], "Isatou Ceesay");

W("food", "share", "Feeding Neighbors", "Getting good food to people who are short of it.", [

W("food", "seeds", "Seeds & Farming", "Saving seed, improving soil and raising crops.", [
  "Grow out and save seed from three heirloom varieties and start a school seed library.",
  "Test three ways of improving soil on small plots and compare the harvests."]);
W("food", "foodsci", "Food Science & Inventions", "Fermenting, freezing, baking and the science behind them.", [
  "Develop an original food product through at least ten test batches, with tasters scoring each one.",
  "Investigate one food process, like sourdough, cheese or drying, and teach it."]);
W("food", "foodculture", "Food Traditions", "Dishes and shared meals that carry a people's history.", [
