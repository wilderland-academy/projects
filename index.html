  "Organize a community meal where every family brings a dish and its story."]);
W("food", "smallfarm", "Bees, Chickens & Small Farms", "Looking after animals that feed people.", [
  "Raise chickens or keep a beehive for a season with a mentor, and keep careful records.",
  "Help on a working farm or ranch and document a full cycle of its work."]);

S("waters", "garden", "The Edible Schoolyard", "An acre of asphalt becomes a garden", "Berkeley, California, USA", [37.88, -122.27], "1995", 0,
  "Chef Alice Waters passed a run-down middle school every day and said publicly that it looked neglected. The principal invited her to help. Students, teachers and neighbors tore up an acre of asphalt and planted a garden, then built a kitchen classroom next to it.",
  "Students grow, cook and eat food together as part of the school day, and use the garden for science, math and history.",
  "Thousands of schools around the world have started gardens modeled on it.",
  ["Start or expand a school garden and cook a meal for your class from what you grew."],
  ["cook", "schoolvoice", "seeds"], "Edible Schoolyard");
S("finley", "garden", "Ron Finley", "The gardener who got a ticket", "South Los Angeles, USA", [33.99, -118.30], "2010", 0,
  "Ron Finley lived in a neighborhood with plenty of fast food and almost no fresh vegetables. He planted a garden in the strip of dirt between the sidewalk and the street outside his house. The city sent him a citation for gardening without a permit.",
  "He refused to pull it out, gathered support, and the city changed its rules.",
  "He has helped plant gardens in empty lots across the city and teaches young people that growing food is a way of taking charge of your own life.",
  ["Find unused ground in a public place. Get permission, plant food there, and let anyone harvest."],
  ["law", "local", "campaign"], "Ron Finley");
S("katie", "share", "Katie Stagliano", "A 40-pound cabbage", "Summerville, South Carolina, USA", [33.02, -80.18], "2008", 9,
  "In third grade, Katie Stagliano brought home a cabbage seedling from a school program and looked after it carefully. It grew to 40 pounds. She gave it to a soup kitchen, where it helped feed 275 people.",
  "Seeing how many people one vegetable could feed made her want to grow more, and her school gave her space for a garden.",
  "She started Katie's Krops, which gives young people in many states what they need to start gardens and donate the harvest.",
  ["Grow one crop as well as you possibly can and donate it. Record how many meals it became."],
  ["garden", "kind", "needs"], "Katie's Krops");
S("wck", "share", "José Andrés", "World Central Kitchen", "Port-au-Prince, Haiti", [18.54, -72.34], "2010", 0,
  "After a terrible earthquake in Haiti, chef José Andrés flew in and started cooking in a camp. Local women showed him he was making the beans wrong, and he learned to cook them the way people there liked. He founded World Central Kitchen on that idea.",
  "After a disaster his teams hire local cooks and make local dishes, so people get food that comforts them and the money stays in the community.",
  "The group has served hundreds of millions of meals after hurricanes, earthquakes, fires and wars.",
  ["Plan and cook a meal for a large group in need, and ask them first what they would most like to eat."],
  ["cook", "needs", "foodculture"], "World Central Kitchen");
S("popsicle", "foodsci", "Frank Epperson", "The accidental ice pop", "San Francisco Bay Area, USA", [37.80, -122.27], "1905", 11,
  "As Frank Epperson told the story, when he was 11 he left a cup of soda powder and water on the porch with the stirring stick still in it. The night was unusually cold. In the morning he had a frozen treat on a handle.",
  "He remembered the accident, made the treats for friends, and years later sold them at a fair.",
  "He patented it in 1923. His own children called it Pop's 'sicle, and the name stuck.",
  ["Keep a notebook of kitchen accidents and surprises. Turn the best one into a product through careful test batches."],
  ["kidbiz", "invent", "experiment"], "Popsicle history Frank Epperson");
S("langar", "foodculture", "Langar at the Golden Temple", "A free meal for anyone who comes", "Amritsar, India", [31.62, 74.88], "for about 500 years", 0,
  "At the Golden Temple, the holiest site of the Sikh faith, a free kitchen called langar serves a hot meal to anyone who walks in, of any religion or background. Everyone sits on the floor in rows and eats the same food. Volunteers chop, cook, serve and wash up.",
  "Sitting and eating side by side is meant to show that all people are equal.",
  "The kitchen serves tens of thousands of meals every day, and Sikh temples around the world run their own.",
  ["Organize a shared meal where everyone eats together as equals and volunteers do every job. Find out what it takes to feed 100 people."],
  ["share", "tradition", "kind"], "Langar Golden Temple");

S("parkrun", "run", "parkrun", "Thirteen runners in a park", "Bushy Park, London, England", [51.41, -0.34], "2004", 0,
  "Paul Sinton-Hewitt was injured and missing his running friends. He organized a free, timed five-kilometer run in his local park one Saturday morning so he could see them. Thirteen runners came, and he recorded their times himself.",
  "It stayed free and weekly, and it welcomed walkers and slow runners as warmly as fast ones.",
  "It now happens every week at more than 2,000 places in over 20 countries, run entirely by volunteers.",
  ["Start a free weekly event that gets people moving. Record results, welcome every pace, and keep it going for two months."],
  ["local", "kind", "health"], "parkrun");
S("dekker", "exped", "Laura Dekker", "Around the world alone", "Den Osse, Netherlands", [51.74, 3.89], "2010", 14,
  "Laura Dekker was born on a boat and sailed alone from age six. At 13 she announced a plan to sail solo around the world. A Dutch court stopped her for almost a year. She used the time to get a bigger boat and train in first aid, repairs and how to manage sleep alone at sea.",
  "The delay made her better prepared. She set off at 14 and did her schoolwork on board.",
  "She finished in January 2012 at 16, the youngest person to sail around the world alone.",
  ["Plan a demanding journey in full: route, risks, training, gear and budget. Present the plan to experts, then make the trip with the safety they require."],
  ["voyage", "outdoor", "diary"], "Laura Dekker");
S("ultimate", "newsport", "Ultimate", "A sport invented by high schoolers", "Maplewood, New Jersey, USA", [40.73, -74.27], "1968", "Teens",
  "Students at Columbia High School started playing a team game with a flying disc in the school parking lot. Joel Silver proposed it to the student council, half as a joke. He and two friends wrote down the rules in 1970 and mailed copies to other schools.",
  "The game has no referees. Players call their own fouls and settle disputes themselves, a rule known as Spirit of the Game.",
  "Ultimate is now played by millions of people in more than 100 countries.",
  ["Invent a team game with a rule that builds fairness into play. Write the rulebook and teach it to another school."],
  ["team", "peace", "board"], "Ultimate (sport)");
S("snurfer", "boardsport", "The Snurfer", "Two skis bolted together", "Muskegon, Michigan, USA", [43.23, -86.25], "1965", 0,
  "On Christmas Day 1965, Sherman Poppen wanted to get his daughters playing outside. He fastened two children's skis side by side so they could stand on them and surf down a snowy hill. His wife named it the Snurfer, for snow and surfer. Every kid on the street wanted one.",
  "It was a toy made in an afternoon for two children.",
  "About a million Snurfers were sold. Teenagers who raced them went on to build the first modern snowboards, and snowboarding became an Olympic sport in 1998.",
  ["Build a new way to slide, roll or glide. Test it safely, improve it three times, and teach others to ride it."],
  ["wood", "invent", "kidbiz"], "Snurfer");
S("nissen", "newsport", "George Nissen", "The trampoline", "Cedar Rapids, Iowa, USA", [41.98, -91.67], "1930", 16,
  "George Nissen, a 16-year-old gymnast, watched circus trapeze artists drop into the safety net and bounce. He wondered what tricks you could do if you kept bouncing. In his parents' garage he stretched canvas across a frame of scrap iron.",
  "He kept improving it for years with his coach, adding springs made from inner tubes, and named it after the Spanish word for diving board.",
  "Trampolining became an Olympic sport in 2000. He was there to see it, at 86.",
  ["Notice a moment in a sport or show that looks like fun and build equipment that lets people do more of it. Make safety part of the design."],
  ["circus", "invent", "mech"], "George Nissen");
S("skateistan", "boardsport", "Skateistan", "Three skateboards in Kabul", "Kabul, Afghanistan", [34.53, 69.17], "2007", 0,
  "Oliver Percovich arrived in Kabul from Australia with three skateboards. Children crowded around wanting a turn, girls as much as boys. Skateboarding was so new there that nobody had made a rule against girls doing it. He started lending out boards, then built a school.",
  "Kids come for the skating and stay for the classroom lessons that go with it.",
  "Skateistan has run schools in Afghanistan, Cambodia and South Africa. More than half of its students are girls.",
  ["Use a sport you love as the way in to something else: tutoring, a club, a friendship between schools."],
  ["teach", "rights", "include"], "Skateistan");
S("guttmann", "adaptive", "Ludwig Guttmann", "The first wheelchair games", "Stoke Mandeville, England", [51.80, -0.80], "1948", 0,
  "Dr. Ludwig Guttmann, a refugee from Nazi Germany, ran a hospital unit for soldiers with spinal injuries. At the time such patients were expected to stay in bed. He got them playing sport. On the opening day of the 1948 London Olympics he held an archery contest for 16 patients in wheelchairs.",
  "He treated injured people as athletes, and they became healthier and more hopeful.",
  "His games grew into the Paralympics, which now bring together more than 4,000 athletes from around the world.",
  ["Organize a competition designed so people of different abilities truly compete. Ask the athletes to help set the rules."],
  ["include", "health", "team"], "Ludwig Guttmann");

/* ---------- CIVIC LIFE & CHANGE ---------- */

W("civic", "law", "Laws & Government", "How rules get made, and how citizens of any age can propose one.", [

W("civic", "rights", "Rights & Fairness", "Making sure rules treat people equally.", [

W("civic", "peace", "Peace-Building", "Helping people who distrust each other to meet, listen and work together.", [

  "Train as a peer mediator and help settle real disagreements at school."]);
W("civic", "schoolvoice", "Student Voice", "Students improving their own schools.", [

W("civic", "local", "Neighborhood Projects", "Small public improvements made by the people who live there.", [

W("civic", "debate", "Debate & Elections", "Arguing well, listening well and choosing leaders.", [

S("malala", "rights", "Malala Yousafzai", "A diary for girls' schools", "Mingora, Pakistan", [34.77, 72.36], "2009", 11,
  "When Malala Yousafzai was 11, an armed group took over her valley and ordered girls' schools to close. She wrote a diary for the BBC under a made-up name, describing what it was like to be told she could not learn. Then she began speaking in public under her own name.",
  "At 15 she was attacked and badly hurt by a gunman who wanted to silence her. She recovered and kept speaking.",
  "On her sixteenth birthday she addressed the United Nations. At 17 she became the youngest person ever to win the Nobel Peace Prize, and her fund supports girls' education in many countries.",
  ["Write honestly, day by day, about something in your world that is unfair. Decide who needs to read it and get it to them.",
   "Find out which children near you or far away are missing school, and why. Present what would help."],
  ["diary", "news", "teach"], "Malala Yousafzai");
S("johns", "schoolvoice", "Barbara Johns", "A walkout that reached the Supreme Court", "Farmville, Virginia, USA", [37.30, -78.39], "1951", 16,
  "Barbara Johns's high school for Black students had classrooms in tar-paper shacks, with no gym, cafeteria or science labs. The white school across town had all of them. At 16 she secretly planned an assembly, got the principal out of the building, and asked all 450 students to walk out with her.",
  "The students stayed out for two weeks and asked civil rights lawyers for help. The lawyers agreed to take the case if the students would fight segregation itself.",
  "Their case became one of five decided in 1954, when the Supreme Court ruled that segregated schools were unconstitutional. In 2025 her statue was placed in the U.S. Capitol.",
  ["Document something unequal or run-down at your school with photos and numbers. Present it to the people who can fix it, with a plan."],
  ["rights", "law", "campaign"], "Barbara Rose Johns");
S("tinker", "rights", "Mary Beth Tinker", "The armbands case", "Des Moines, Iowa, USA", [41.59, -93.62], "1965", 13,
  "During the Vietnam War, 13-year-old Mary Beth Tinker, her brother and a friend wore black armbands to school to mourn the dead and support a truce. The school had banned armbands and suspended them. Their families took the school district to court.",
  "The case took four years. In 1969 the Supreme Court ruled 7 to 2 that students do not lose their right to free speech at the schoolhouse gate.",
  "That ruling still protects students of every viewpoint who express opinions peacefully at school.",
  ["Research what rights students have at school and where the limits are. Make an accurate guide and teach it."],
  ["law", "schoolvoice", "debate"], "Tinker v. Des Moines");
S("utahraptor", "law", "Kenyon Roberts", "A 10-year-old and the Utah state dinosaur", "Salt Lake City, Utah, USA", [40.78, -111.89], "2018", 10,
  "Kenyon Roberts, a 10-year-old dinosaur fan, thought the fierce Utahraptor, discovered in Utah, should be a state symbol. He made his case to a state senator, who agreed to sponsor a bill. The first plan was to replace the state fossil, the Allosaurus, and that upset some people.",
  "They found a compromise by creating a new symbol, the state dinosaur, so the Allosaurus kept its title. Kenyon spoke to lawmakers himself.",
  "The bill passed in 2018. Utah later created Utahraptor State Park near Moab.",
  ["Propose a new symbol, holiday or rule for your town or state. Find a sponsor, prepare your testimony, and be ready to compromise."],
  ["fossil", "debate", "design"], "Utahraptor state dinosaur Utah");
S("copeny", "campaign", "Mari Copeny", "A letter from Flint", "Flint, Michigan, USA", [43.01, -83.69], "2016", 8,
  "The tap water in Mari Copeny's city was contaminated with lead. At 8 she wrote to the President asking to meet him when she traveled to Washington for a hearing. He wrote back and came to Flint to see for himself.",
  "Her letter kept national attention on her city. The government later approved $100 million to help fix the water system.",
  "She has since raised money for backpacks and bottled water, and more than $500,000 for water filters for communities with unsafe water.",
  ["Write a clear, personal letter about a local problem to the highest official you can reach. Follow up until you get an answer."],
  ["letters", "water", "needs"], "Mari Copeny");
S("sadako", "peace", "Sadako's classmates", "The Children's Peace Monument", "Hiroshima, Japan", [34.39, 132.45], "1955", 12,
  "Sadako Sasaki was two when an atomic bomb was dropped on Hiroshima at the end of World War II. Ten years later she became ill from its effects. In the hospital she folded paper cranes, following a legend that a thousand cranes bring a wish. She died at 12. Her classmates decided to build a monument to all the children who had died.",
  "They wrote to schools across Japan, and children sent in their coins.",
  "The monument opened in 1958 in Hiroshima's Peace Park. Children around the world still send paper cranes to it every year.",
  ["Create a memorial or a tradition that helps your community remember something important. Involve as many other students as you can."],
  ["origami", "fundraise", "sculpt"], "Children's Peace Monument");
S("severn", "campaign", "Severn Cullis-Suzuki", "Six minutes at the Earth Summit", "Vancouver, Canada", [49.28, -123.12], "1992", 12,
  "At nine, Severn Cullis-Suzuki started an environmental club with her friends. At 12 they raised the money to travel to a world meeting of leaders in Brazil. She was given six minutes to speak. She told the adults: if you don't know how to fix it, please stop breaking it.",
  "She spoke plainly, as a child to parents, and the room went silent.",
  "Her speech was shared around the world and is still watched today.",
  ["Write and rehearse a six-minute speech to people with power over something you care about. Then find a way to deliver it to them."],
  ["poetry", "climate", "fundraise"], "Severn Cullis-Suzuki");

W("service", "include", "Inclusion & Access", "Opening doors for people who are usually shut out.", [

S("hreljac", "needs", "Ryan Hreljac", "Ryan's Well", "Kemptville, Ontario, Canada", [45.02, -75.64], "1998", 6,
  "In first grade, Ryan Hreljac's teacher said that many children in Africa walk for hours to fetch water, and it is often dirty. He did extra chores for four months and earned $70. Then he learned a well really cost $2,000. He kept going, speaking to clubs and classes until he had it.",
  "He was six, and he didn't quit when the price turned out to be thirty times higher.",
  "His first well was drilled at a school in Uganda in 1999. His foundation has since completed about 1,800 water projects serving 1.6 million people.",
  ["Choose one concrete thing that costs a known amount and would change lives. Earn or raise the full sum and follow it until it is built."],
  ["water", "fundraise", "letters"], "Ryan Hreljac");
S("alexscott", "fundraise", "Alex Scott", "Alex's Lemonade Stand", "Connecticut and Pennsylvania, USA", [41.76, -72.74], "2000", 4,
  "Alex Scott had cancer from before her first birthday. At four, after a treatment, she told her mother she wanted to hold a lemonade stand and give the money to her doctors so they could help other kids. Her first stand raised $2,000. She held one every year, and people in other places began holding stands too.",
  "She was sick herself and chose to raise money for other children.",
  "By the time she died in 2004, at age 8, the stands had raised a million dollars. The foundation her family runs has since raised more than $300 million for research.",
  ["Run a stand, sale or event for a cause you have studied. Set a goal, track every dollar and invite others to copy you."],
  ["market", "health", "comfort"], "Alex's Lemonade Stand Foundation");
S("rubykate", "elders", "Ruby Kate Chitsey", "Three wishes", "Harrison, Arkansas, USA", [36.23, -93.11], "2018", 11,
  "Ruby Kate Chitsey often went with her mother, a nurse, to work in nursing homes. She learned that many residents had only about $40 a month to spend on everything they wanted. She took a notebook from room to room and asked each person: if you could have three things, what would they be?",
  "The wishes were small: fresh fruit, a pair of pants that fit, a phone, a haircut. She began granting them herself.",
  "Donations came in from around the world. Her project has raised well over $100,000 and spread to other nursing homes.",
  ["Ask a group of people who are rarely asked what they would wish for. Write the answers down and grant as many as you can."],
  ["oral", "kind", "fundraise"], "Three Wishes for Ruby's Residents");
S("buddybench", "kind", "Christian Bucks", "The buddy bench", "York, Pennsylvania, USA", [39.96, -76.73], "2013", 8,
  "Christian Bucks, a second grader, thought his family might move abroad and worried about being lonely at a new school. He had seen a special bench in a school brochure. He asked his principal for one: if you have no one to play with, you sit there, and other kids know to invite you in.",
  "It gave kids a simple, quiet way to ask for a friend.",
  "Newspapers picked up the story, and thousands of schools around the world now have buddy benches.",
  ["Design and build a physical thing that makes kindness easier at school. Teach everyone how it works and check whether it gets used."],
  ["wood", "schoolvoice", "design"], "Buddy bench");
S("terryfox", "fundraise", "Terry Fox", "The Marathon of Hope", "St. John's, Newfoundland, Canada", [47.56, -52.71], "1980", 0,
  "Terry Fox lost his right leg to cancer at 18. In the hospital he saw how many children were suffering from the disease. At 21 he set out to run across Canada on an artificial leg to raise money for research. He ran about a marathon every day for 143 days and covered 5,373 kilometers.",
  "He had to stop when the cancer came back, and he died the next year. His goal had been one dollar from every Canadian, and he lived to see it reached.",
  "Terry Fox Runs are held every year around the world and have raised about a billion Canadian dollars.",
  ["Set a physical challenge that is hard for you, train for it properly, and complete it to raise money for something you care about."],
  ["run", "health", "adaptive"], "Terry Fox");
S("specialolympics", "include", "Eunice Kennedy Shriver", "A summer camp in the backyard", "Potomac, Maryland, USA", [39.02, -77.21], "1962", 0,
  "Eunice Kennedy Shriver's sister Rosemary had an intellectual disability. In those days such children were kept out of camps, teams and often schools. In 1962 Eunice opened a free summer camp at her own home, with swimming, riding and games. Teenagers volunteered as counselors.",
  "The camp showed that these children could do far more than people assumed if they were given a chance to play.",
  "It grew into Special Olympics, which began in 1968 with about 1,000 athletes and now includes millions of athletes in more than 170 countries.",
  ["Run a camp day, club or tournament for kids who usually get left out of sports or arts. Plan it with them."],
  ["adaptive", "team", "kind"], "Camp Shriver Special Olympics");
S("khan", "teach", "Sal Khan", "Tutoring a cousin", "Boston, Massachusetts, USA", [42.36, -71.06], "2004", 0,
  "Sal Khan's 12-year-old cousin Nadia was struggling with math in another city, so he tutored her by phone with a shared online notepad. Other cousins wanted help too. He began recording short lessons and posting them online so they could watch whenever they liked.",
  "His cousins told him they preferred the videos to him in person, because they could pause and replay without feeling embarrassed.",
  "Strangers started watching. He left his finance job in 2009, and Khan Academy has since given free lessons to well over 100 million learners.",
  ["Make a series of short lessons that explain something you understand well. Test them on real learners and fix the confusing parts."],
  ["code", "film", "mathart"], "Khan Academy history");
S("campbell", "comfort", "Campbell Remess", "A bear a day", "Hobart, Tasmania, Australia", [-42.88, 147.33], "2013", 9,
  "At nine, Campbell Remess asked his parents if he could buy Christmas presents for children in the hospital. With nine kids in the family, they said it would cost too much. So he taught himself to use his mother's sewing machine. His first teddy bear took five hours.",
  "He got faster and set himself a goal of one toy every day, calling it Project 365. He delivered them to sick children himself.",
  "By 12 he had made more than 800 bears and other toys, and he kept going.",
  ["Teach yourself to make one thing well. Then make it on a steady schedule for people who are having a hard time."],
  ["textile", "kind", "health"], "Campbell Remess Project 365");

/* ---------- ENTERPRISE ---------- */
W("enterprise", "kidbiz", "Kid-Run Businesses", "A real product or service, real customers and real accounts.", [
  "Start a small business. Sell to at least 20 customers, keep proper accounts, and present your profit and what you learned.",
  "Offer a service your neighbors need and run it reliably for two months."]);
W("enterprise", "social", "Businesses That Do Good", "Earning money in a way that fixes a problem.", [
  "Design a business whose product helps people or the land. Test it at small scale.",
  "Pick a cause and build a product whose sales pay for it. Report exactly how much went where."]);
W("enterprise", "market", "Markets & Stands", "Selling face to face.", [
  "Run a stall at a farmers' market or school fair for several weeks and improve it each time.",
  "Organize a student makers' market with at least ten sellers."]);
W("enterprise", "loans", "Money & Microloans", "Saving, lending and investing to help people get started.", [
  "Set up a small lending circle or savings club and track how it does over a term.",
  "Raise a fund, lend it through a microloan site, and report on the borrowers and repayments."]);
W("enterprise", "product", "Products & Brands", "Designing something people want and making it recognizable.", [
  "Develop one product from sketch to packaging. Get honest feedback from 30 people.",
  "Create the name, logo, label and story for a real local product."]);

S("mikaila", "kidbiz", "Mikaila Ulmer", "Me & the Bees Lemonade", "Austin, Texas, USA", [30.27, -97.74], "2009", 4,
  "At four, Mikaila Ulmer was stung by bees twice in one week. Her parents suggested she learn about them, and she found out how much we depend on bees and that they were in trouble. Around then her great-grandmother sent a 1940s recipe for lemonade made with flaxseed. Mikaila sweetened it with local honey and sold it at a stand.",
  "She built a business that helps the thing she had been afraid of. A share of the profits goes to groups that protect bees.",
  "Her lemonade won investment on a TV business show and is sold in more than 1,500 stores.",
  ["Build a small business around something you want to protect. Decide up front what share of the profit goes to it."],
  ["pollin", "smallfarm", "foodsci"], "Mikaila Ulmer");
S("moziah", "product", "Moziah Bridges", "Mo's Bows", "Memphis, Tennessee, USA", [35.15, -90.05], "2011", 9,
  "Moziah Bridges liked to dress sharply and couldn't find bow ties he liked. At nine he asked his grandmother to teach him to sew. He made ties from her fabric scraps at the kitchen table and sold them online and in local shops.",
  "He made something he wanted for himself, with a skill learned from his grandmother.",
  "A well-known investor became his mentor after he appeared on a TV business show. He later signed a deal to make bow ties for professional basketball teams.",
  ["Make the product you wish existed. Sell it to real customers and improve it from what they tell you."],
  ["textile", "fashion", "kidbiz"], "Mo's Bows");
S("mayapenn", "social", "Maya Penn", "Maya's Ideas", "Atlanta, Georgia, USA", [33.75, -84.39], "2008", 8,
  "At eight, Maya Penn began making headbands and scarves from old and leftover fabric and selling them. She learned to code so she could build her own website. As orders grew she kept the materials recycled or organic and gave part of her profits to charity.",
  "She showed that a company run by a child could be careful about the planet from the start.",
  "She has given popular talks, written a book and started an animation studio.",
  ["Start a product line made only from reused materials. Track what you saved from the trash alongside what you earned."],
  ["fashion", "waste", "code"], "Maya Penn");
S("yunus", "loans", "Muhammad Yunus", "Twenty-seven dollars", "Jobra, Bangladesh", [22.47, 91.79], "1976", 0,
  "Economics professor Muhammad Yunus met women in a village near his university who made bamboo stools. They had to borrow from moneylenders who took nearly all their profit. He lent $27 of his own money to 42 villagers so they could buy materials themselves. Every one of them paid him back.",
  "Banks had refused to lend to poor people. He showed they repay small loans reliably, and he started a bank that lends mostly to women.",
  "He won the Nobel Peace Prize in 2006. Small loans are now offered around the world, though experts still argue about how much they reduce poverty.",
  ["Find out what small amount of money would let someone near you start earning. Design a fair way to lend it and track what happens."],
  ["social", "rights", "experiment"], "Muhammad Yunus");

/* ---------- HISTORY, CULTURE & LANGUAGE ---------- */
W("culture", "oral", "Oral History & Family Stories", "Recording what people remember before it is lost.", [
  "Interview five elders about one period or place. Edit the recordings into an archive and give copies to the families.",
  "Trace your family's story back as far as you can and present it with documents, maps and voices."]);
W("culture", "language", "Languages", "Learning them, saving them and writing them down.", [
  "Learn a language to the point of holding a real 15-minute conversation with a fluent speaker.",
  "Document words and sayings from a language or dialect spoken by families at your school."]);
W("culture", "maps", "Maps & Mapping", "Drawing the world so that people can use it.", [
  "Map something about your valley that no map shows: old trails, sledding hills, where the springs are.",
  "Join an open mapping project and add your own area accurately."]);
W("culture", "museum", "Museums & Collections", "Gathering objects and telling their story.", [
  "Curate a small museum exhibit on local history, with labels you research and write.",
  "Build a serious collection of one kind of thing, catalog it, and display it."]);
W("culture", "dig", "Archaeology & Finds", "Learning about people from what they left behind.", [
  "Survey an old site with an expert and record what you find properly.",
  "Research the history under your school: who lived there, what they left, how we know."]);
W("culture", "tradition", "Traditions & Festivals", "Customs, ceremonies and celebrations that hold a community together.", [
  "Research a tradition from your own heritage and teach it to your class by doing it.",
  "Start a new annual event at school that future classes can keep going."]);
W("culture", "decipher", "Deciphering the Past", "Old scripts, codes and documents that someone has to puzzle out.", [
  "Transcribe and explain a set of old handwritten letters or records from a local archive.",
  "Learn an ancient or unfamiliar script well enough to read and write short texts in it."]);
W("culture", "voyage", "Navigation & Voyaging", "Finding the way by stars, sun, wind and land.", [
  "Learn to navigate without electronics and prove it on a real route.",
  "Build a working model of a traditional boat and explain how its makers sailed it."]);

S("sequoyah", "language", "Sequoyah", "A writing system for the Cherokee", "Cherokee Nation (now Alabama, USA)", [34.44, -85.72], "1821", 0,
  "Sequoyah was a Cherokee silversmith who could not read any language. He saw that written marks let people send words across distance, and he decided his people should have that too. He worked for about twelve years, through ridicule, and arrived at 86 symbols, one for each syllable of Cherokee.",
  "He demonstrated it with his young daughter, Ayoka. They sent messages back and forth while leaders watched.",
  "Within a few years thousands of Cherokee could read and write. In 1828 the nation began printing its own newspaper.",
  ["Create a clear writing or symbol system for something that has none. Teach it to someone younger and prove it works."],
  ["codes", "news", "worlds"], "Sequoyah Cherokee syllabary");
S("baird", "language", "Jessie Little Doe Baird", "Bringing a language back", "Mashpee, Massachusetts, USA", [41.65, -70.48], "1993", 0,
  "Nobody had spoken the Wampanoag language for about 150 years. Jessie Little Doe Baird, a Wampanoag social worker, began having dreams of people speaking words she didn't understand. She found that her ancestors had left a Bible, letters and land records written in the language. She studied linguistics and used them to rebuild its grammar and a dictionary of over 11,000 words.",
  "A language carries a people's way of seeing the world. Hers had been asleep on paper.",
  "Her daughter grew up as the first native speaker in seven generations, and children now learn Wampanoag at school.",
  ["Find something from your community's past that survives only in documents. Bring one piece of it back into use."],
  ["decipher", "teach", "tradition"], "Jessie Little Doe Baird");
S("ventris", "decipher", "Michael Ventris", "Cracking Linear B", "London, England", [51.51, -0.13], "1936", 14,
  "On a school trip at 14, Michael Ventris heard a famous archaeologist say that clay tablets found in Crete were written in a script nobody could read. He decided he would be the one. He became an architect and worked on the script in his evenings for years, building on careful tables made by scholar Alice Kober.",
  "He shared his working notes with experts as he went, including his wrong guesses.",
  "In 1952 he showed that the tablets were written in a very early form of Greek, centuries older than anyone had thought Greek writing was.",
  ["Pick an unsolved or hard-to-read puzzle from history. Work on it steadily and share your notes with people who know more."],
  ["puzzle", "codes", "dig"], "Michael Ventris");
S("storycorps", "oral", "StoryCorps", "Forty minutes with someone you love", "New York City, USA", [40.75, -73.98], "2003", 0,
  "Radio producer Dave Isay put a small recording booth in a busy train station. Two people who know each other go in and one interviews the other for 40 minutes. They take a copy home, and another goes to the national library.",
  "Ordinary people's lives were recorded with the same care as the lives of famous people. Many families now have the only recording of a grandparent's voice.",
  "Hundreds of thousands of people have taken part. Each Thanksgiving, students are invited to interview an elder and add it to the archive.",
  ["Record interviews with elders using a set of great questions. Edit them into an archive and hold a listening event."],
  ["record", "elders", "diary"], "StoryCorps");
S("osm", "maps", "OpenStreetMap", "A map of the world made by volunteers", "London, England", [51.52, -0.13], "2004", 0,
  "Steve Coast, a student, was annoyed that map data was owned by governments and companies. He started a free map that anyone could add to by walking around with a GPS. People mapped their own streets, footpaths, wells and benches.",
  "When an earthquake struck Haiti in 2010, hundreds of volunteers traced satellite photos. Within days they had made the best map of the capital there was, and rescue teams used it.",
  "Millions of people have contributed, and volunteers still hold mapathons to map places before disaster strikes.",
  ["Map your area in detail for an open map, including things only locals know. Or join a mapathon for a place that needs it."],
  ["open", "needs", "trails"], "OpenStreetMap");
S("hokulea", "voyage", "Hōkūle‘a", "Sailing by the stars", "Honolulu, Hawai‘i, USA", [21.31, -157.86], "1976", 0,
  "Some scholars claimed that Polynesians had reached their islands by drifting there by accident. A group in Hawai‘i built a traditional double-hulled canoe and sailed it 2,500 miles to Tahiti with no instruments. Their navigator, Mau Piailug from Micronesia, read the stars, the swells and the birds.",
  "The voyage showed that Pacific Islanders had crossed the ocean on purpose, with great skill. It also began a revival of Hawaiian language and culture.",
  "More than 17,000 people met the canoe in Tahiti. A new generation learned to navigate, and Hōkūle‘a later sailed around the world.",
  ["Learn a traditional skill from a master and prove it works with a real test, in public."],
  ["astro", "wood", "exped"], "Hokulea");
S("saga", "dig", "Saga Vanecek", "The girl who pulled a sword from a lake", "Lake Vidöstern, Sweden", [57.10, 14.00], "2018", 8,
  "During a drought, 8-year-old Saga Vanecek was wading in the lake by her family's summer house when she felt something long and hard under the water. She lifted it and shouted to her father that she had found a sword. It was about 1,500 years old, older than the Vikings.",
  "Her family reported it to the local museum. Experts asked her to keep it secret for months while they searched the lake for more.",
  "They found other objects nearby, and the sword went on display.",
  ["Learn the right way to report a find where you live. Then survey a shoreline, field or attic carefully and record everything."],
  ["museum", "fossil", "water"], "Saga Vanecek sword");

/* Stories added so that every kind of project has at least one real example. */
S("billie", "song", "Billie Eilish and Finneas", "A song made in a bedroom", "Los Angeles, USA", [34.05, -118.24], "2015", 13,
  "Finneas O'Connell wrote a song called \"Ocean Eyes\" for his band. His younger sister Billie, then 13, sang it. They recorded it in his bedroom at their family home and she uploaded it to SoundCloud in 2015.",
  "Two siblings with a laptop, a microphone and their parents' house showed that a song does not need a big studio to reach people.",
  "The song spread around the world. Billie and Finneas kept writing and recording together at home, and Finneas co-wrote and produced her music, which won many Grammy Awards.",
  ["Write a short song with a partner. One person makes the music, the other writes the words. Record it on a phone and play it for three people."],
  ["record", "band", "compose"], "Billie Eilish Ocean Eyes");
S("lespaul", "record", "Les Paul", "The tinkerer who taught machines to play along", "Waukesha, USA", [43.01, -88.23], "1940s", 0,
  "Les Paul grew up taking apart radios and gadgets. As a guitarist he wanted to be heard in big rooms, so he built electric guitars and amplifiers. In the 1940s and 50s he worked out how to record one part, then play it back and record another on top, again and again.",
  "Layering sounds meant one person could sound like a whole band, with no band in the room.",
  "Multitrack recording became the way almost all music is made. The Gibson Les Paul guitar still carries his name.",
  ["Record yourself clapping a rhythm. Play it back and add a second part on top, then a third. See how many layers you can build before it gets muddy."],
  ["song", "sound", "invent"], "Les Paul");
S("spolin", "comedy", "Viola Spolin", "Games that taught kids to improvise", "Chicago, USA", [41.88, -87.63], "1939", 0,
  "In the late 1930s Viola Spolin worked with immigrant children in Chicago, many of whom did not speak much English. She invented simple theater games in which players had to listen, react and invent a scene on the spot, with no script.",
  "Games let shy children and new arrivals take part without being good at acting first.",
  "She collected the games in the 1963 book Improvisation for the Theater. Her son Paul Sills helped found The Second City, and her games are still used by classrooms and comedy troupes.",
  ["Play a one-word-at-a-time story with friends. Each person adds one word. Then try a scene where every line must begin with \"Yes, and\"."],
  ["theater", "teach", "kind"], "Viola Spolin");
S("phare", "circus", "Phare Ponleu Selpak", "From drawing in a refugee camp to a circus", "Battambang, Cambodia", [13.10, 103.20], "1994", "Teens",
  "In the 1980s, teenagers living in a refugee camp on the Thai border were given paper and colored pencils by a French aid worker and allowed to draw whatever they wanted. After they returned to Cambodia, they set up an art school in Battambang in 1994. One of them, Khuon Det, had learned circus skills in the camp and began a course for performers.",
  "Making art gave young people who had lived through war a way to express what they felt and to build something together.",
  "The school now teaches more than a thousand students dance, music, drawing, theater and circus. Its alumni have performed around the world, and one became the first Cambodian to work with Cirque du Soleil.",
  ["Teach yourself one circus skill for a month, such as juggling three scarves or balancing a spoon. Show it at a showcase and teach one friend."],
  ["theater", "dance", "peace"], "Phare Ponleu Selpak");
S("dogood", "zine", "Benjamin Franklin as Silence Dogood", "A 16-year-old with a made-up name", "Boston, USA", [42.36, -71.06], "1722", 16,
  "Benjamin Franklin was an apprentice in his older brother's print shop. He wanted to write for his brother's newspaper but knew it would be refused, so he invented a middle-aged widow named Silence Dogood and slid her letters under the shop door at night. Fourteen of them were printed.",
  "Writing under another name let a teenager be judged on his ideas, not his age.",
  "Franklin left for Philadelphia at 17 and became a printer and publisher. He later printed Poor Richard's Almanack, started a lending library and helped found a university.",
  ["Make a one-page newsletter or zine on something you know a lot about. Copy it, fold it, and hand it out."],
  ["news", "letters", "library"], "Benjamin Franklin Silence Dogood");
S("andersont", "museum", "Anderson Taylor", "A museum in a town of 2,000", "Cambridge, Illinois, USA", [41.30, -90.19], "2024", 9,
  "Anderson Taylor loved fossils, rocks and old artifacts and kept filling his house with them. With help from his family and neighbors he opened his own museum in Cambridge, Illinois, in August 2024, when he was nine. It holds about 1,000 items, including Tully monsters, the state fossil.",
  "A small town got a place to visit, and local people began donating things they had found.",
  "Guinness World Records named him the youngest male museum curator. He gives talks to school groups, and his museum has inspired other kids to start their own collections.",
  ["Pick a collection you already have. Label ten items with what, where and when. Set them out for visitors and give a five-minute tour."],
  ["fossil", "dig", "kidbiz"], "Anderson Taylor museum curator");
S("sapporo", "tradition", "Sapporo Snow Festival", "Six snow statues that became a festival", "Sapporo, Japan", [43.06, 141.35], "1950", "Teens",
  "In 1950, local high school students in Sapporo built six snow statues in Odori Park. It was a one-day event in the middle of a long winter.",
  "It gave a snowbound city something to enjoy together instead of something to wait out.",
  "The festival grew every year. Teams from abroad have competed since 1974, and in 2007 about two million people visited.",
  ["Invent a seasonal tradition for your neighborhood. Choose a date, a simple rule and one thing to make together."],
  ["landart", "local", "oral"], "Sapporo Snow Festival");
S("goldsworthy", "landart", "Andy Goldsworthy", "Art that melts, blows away or washes out", "Scotland, UK", [55.20, -3.90], "1970s", 0,
  "Andy Goldsworthy makes art outdoors from leaves, ice, stones, sticks and clay, and photographs it before the weather takes it. He has built arches of ice, spirals of leaves and long stone walls that curve through trees.",
  "He shows that a work can be about change and time, and that the ground you walk on is an art studio.",
  "His photographs, books and the film Rivers and Tides have introduced many people to making art from nature.",
  ["Make a pattern from fallen leaves or stones in a park. Photograph it, then come back the next day to see what changed."],
  ["sculpt", "photo", "trees"], "Andy Goldsworthy");
S("blender", "digital", "Blender", "A free 3D studio, bought back by its fans", "Amsterdam, Netherlands", [52.37, 4.90], "2002", 0,
  "Blender started as software made by a small Dutch animation studio. When the company ran into trouble, its users raised about 100,000 euros in 2002 to buy the program and release it free for everyone to use and improve.",
  "Anyone with a computer could model, animate and render in 3D without paying for expensive software.",
  "The Blender community made short open movies such as Elephants Dream and Big Buck Bunny. Students and professional studios use Blender today.",
  ["Download Blender and follow a free tutorial to model a simple object, like a mug. Then change its color and render a picture."],
  ["anim", "open", "design"], "Blender software");
S("sloyd", "wood", "Educational Sloyd", "Woodworking as a way to learn", "Finland and Sweden", [60.17, 24.94], "1866", 0,
  "In 1866 Finland made handcraft a part of its school day, an idea pushed by Uno Cygnaeus. Later, Otto Salomon taught teachers at Nääs in Sweden a method called sloyd: students made useful wooden objects step by step, with a good tool and a careful plan.",
  "Making something by hand trains patience, planning and attention, and gives children a useful result they can be proud of.",
  "Teachers came from many countries to learn it, and hand craft classes spread into schools around the world.",
  ["Make one useful object from wood, like a spoon or a small box. Draw the plan first and write down each step."],
  ["mech", "textile", "teach"], "Educational sloyd Uno Cygnaeus");
S("sewswag", "fashion", "Dillon Eisman", "Thrift-store clothes made fresh for people in need", "Malibu, USA", [34.03, -118.78], "2017", "Teens",
  "As a teenager in Malibu, Dillon Eisman started sewing trendy clothing out of thrift-store finds and gave it to people experiencing homelessness, through a group he called Sew Swag. His designs went quickly at a Los Angeles encampment.",
  "Good-looking clothes helped people feel respected, and reusing old clothes kept things out of landfills.",
  "He worked with the group Project Narnia, which hands out donated items at weekly events in Los Angeles.",
  ["Take three old clothes from a thrift shop and redesign one. Add patches or change the fit, then donate or wear the result."],
  ["textile", "repair", "needs"], "Dillon Eisman Sew Swag");
S("houdini", "magic", "Harry Houdini", "A boy who read about magic and became a legend", "New York, USA", [40.71, -74.00], "1890s", 0,
  "Born Erik Weisz in Budapest, the future Houdini grew up in Wisconsin and loved performing as a child. As a teenager he read the memoirs of the French magician Robert-Houdin and took a stage name from him. He became famous for escaping from handcuffs, locked chests and tanks of water.",
  "He worked out how things were built so he could get out of them. Each escape took practice, research and careful planning.",
  "He became one of the most famous performers in the world and also helped to expose fake psychics.",
  ["Learn one simple trick from a library book. Practice it fifty times before you perform it, and learn how to explain the principle behind it."],
  ["puzzle", "circus", "theater"], "Harry Houdini");
S("ciclovia", "local", "Ciclovía", "A city closes its streets for a day", "Bogotá, Colombia", [4.71, -74.07], "1974", 0,
  "In December 1974 in Bogotá, cycling fans led by Jaime Ortiz Mariño helped to close some streets to cars for a day so that people could ride, walk and skate on them. Bogotá made it official in 1976.",
  "Streets belong to people, and a city can change how it uses them just by agreeing to.",
  "Today more than 120 km of streets are car-free on Sundays and holidays. Cities across Latin America and the world have started their own versions.",
  ["Map one street near you. Where could kids walk, play and ride safely? Draw a plan and show it to a neighbor or a local official."],
  ["campaign", "law", "trails"], "Ciclovía Bogotá");
S("ukyp", "debate", "UK Youth Parliament", "Young people argue it out in the real chamber", "London, UK", [51.50, -0.12], "late 1990s", "Teens",
  "The UK Youth Parliament is made up of young people aged 11 to 18, elected by other young people. Each year hundreds of thousands vote in its elections, and its Make Your Mark ballot asks young people what issues matter most.",
  "Young people have opinions about schools, health and jobs, and this gave them a formal place to say so.",
  "In 2009 MPs voted to let the group debate in the House of Commons chamber, the first time anyone but MPs had used it. A debate there is now held every year.",
  ["Hold a class vote on a real issue. Give two students five minutes each, then let others ask questions before voting."],
  ["schoolvoice", "campaign", "law"], "UK Youth Parliament");
S("mysa", "team", "Mathare Youth Sports Association", "A football league that paid players to clean up", "Nairobi, Kenya", [-1.26, 36.86], "1987", 0,
  "In 1987 Bob Munro started a small football league in Mathare, one of the poorest neighborhoods in Nairobi. Children earned points for taking part in clean-ups of their neighborhood as well as for winning matches.",
  "The league turned sport into a way to care for a neighborhood, and gave children something to be part of.",
  "By 2010 about 14,000 children on 1,200 teams were taking part. Girls' football began in 1992, and the league's professional club has supplied players to Kenya's national team.",
  ["Start a team that earns points for helping the neighborhood. A cleaned playground counts as a goal."],
  ["run", "waste", "include"], "Mathare Youth Sports Association");
S("scouts", "outdoor", "The First Scout Camp", "Twenty boys on an island", "Brownsea Island, England", [50.69, -1.96], "1907", 0,
  "In August 1907 Robert Baden-Powell took about 20 boys to camp on Brownsea Island. They practiced tracking, cooking over fires, first aid and working in patrols. He published the ideas in Scouting for Boys in 1908.",
  "Young people can learn to look after themselves and each other if they are trusted with real tasks outdoors.",
  "Scouting and Guiding spread worldwide, and tens of millions of young people have taken part.",
  ["Plan an overnight camp. Write a menu, a gear list and a first-aid plan, then let each person in your group lead one job."],
  ["trails", "exped", "kind"], "Brownsea Island camp 1907 Scouting");
S("pollpath", "pollin", "The Pollinator Pathway", "A bee road down a city street", "Seattle, USA", [47.61, -122.32], "2008", 0,
  "Artist Sarah Bergmann saw that city green spaces were cut off from each other. She helped neighbors turn the grass strips between street and sidewalk into gardens of native flowers that bees and butterflies like, linking one park to the next along Columbia Street in Seattle.",
  "Pollinators cannot cross long stretches of pavement, so a line of small gardens can work like a road for them.",
  "Twelve gardens had been planted by 2012, and the project won art awards. Other cities have explored their own pathways.",
  ["Plant native flowers in a pot, a school bed or a strip of lawn. Count each kind of insect that visits in ten minutes."],
  ["garden", "wildlife", "sciart"], "The Pollinator Pathway Sarah Bergmann");
S("greenmarket", "market", "The Greenmarket", "Seven farmers and a parking lot", "New York City, USA", [40.76, -73.96], "1976", 0,
  "In 1976 urban planner Barry Benepe pitched a plan to bring farmers directly to New York City. The first market opened that July at 59th Street and Second Avenue, with seven farmers selling from their trucks.",
  "Small family farms got a fair way to sell, and city families got fresh food at a fair price.",
  "The Greenmarket grew to more than 50 markets across the five boroughs. Union Square's market has had as many as 140 farmers, fishers and bakers in peak season.",
  ["Hold a one-day market for your community. Everyone sells something they made or grew, and you price things fairly."],
  ["kidbiz", "garden", "share"], "Greenmarket New York City Barry Benepe");
S("jamie", "cook", "Jamie Oliver", "A chef who took on school lunches", "London, England", [51.51, -0.13], "2005", 0,
  "In 2005 the chef Jamie Oliver made a TV series about school dinners in Greenwich, London, working on a budget of 37 pence per child. He fought for fresher food, taught school cooks new recipes, and gathered 271,677 signatures on a petition that was delivered to 10 Downing Street.",
  "Cooking from scratch is a skill that many people had never learned. He wanted children to learn to eat well and to cook.",
  "The government promised an extra 280 million pounds over three years and set up the School Food Trust. Results were mixed, and some children grumbled, but the campaign changed how Britain talked about school food. He later started the Ministry of Food to teach adults basic cooking.",
  ["Plan and cook a full meal for your family for under a set budget. Include the shopping list and the cost of each item."],
  ["share", "garden", "foodculture"], "Jamie Oliver school dinners");
S("kimmerer", "foodculture", "Robin Wall Kimmerer", "A botanist who listens to the plants", "Syracuse, USA", [43.05, -76.15], "2013", 0,
  "Robin Wall Kimmerer is a plant scientist and a member of the Citizen Potawatomi Nation. In her book Braiding Sweetgrass she weaves Indigenous teachings and scientific knowledge together. One idea is the Honorable Harvest, a set of rules for taking from the earth with respect, such as taking only what you need and giving something back.",
  "How people think about food shapes how they treat the land, and Indigenous traditions carry long experience of living with a place.",
  "The book has sold widely and has been adapted for young readers. She directs the Center for Native Peoples and the Environment, received a MacArthur Fellowship in 2022, and wrote The Serviceberry about sharing.",
  ["Interview an elder about a food tradition in your family. Ask where the food came from, who prepared it and what rules went with it."],
  ["oral", "seeds", "trees"], "Robin Wall Kimmerer");
S("svalbard", "seeds", "Svalbard Global Seed Vault", "A backup copy of the world's crops", "Svalbard, Norway", [78.24, 15.49], "2008", 0,
  "Deep inside a frozen mountain on an island in the Arctic, the vault opened in 2008 to hold duplicate seeds from seed banks around the world. The seeds are sealed in foil and kept at about minus 18 degrees Celsius. Each country or bank still owns what it sends.",
  "If a seed bank is lost to war, flood or accident, the world could lose crop varieties forever.",
  "It now holds more than a million samples. In 2015 a seed bank in Syria affected by war asked for some of its seeds back to regrow them.",
  ["Save seeds from a plant you grow or from a vegetable you ate. Dry them, label them with the date and place, and swap them with a friend."],
  ["garden", "citsci", "foodsci"], "Svalbard Global Seed Vault");
S("fourh", "smallfarm", "4-H", "Clover clubs for young farmers", "Ohio, USA", [39.92, -83.81], "1902", 0,
  "In 1902 in Clark County, Ohio, A. B. Graham began a youth club where children grew corn and learned farm skills. The idea spread to other places and the 4-H clubs formed nationally in 1914.",
  "Young people could learn real farm science by running their own plots and animals.",
  "More than six million members now take part in the United States, and affiliated youth programs run in more than 80 countries. Members pledge head, heart, hands and health.",
  ["Raise something for a season, like a tomato plant or a few chickens. Keep a notebook of what you did and what you learned."],
  ["garden", "seeds", "kidbiz"], "4-H history A. B. Graham");
S("freekibble", "animals", "Mimi Ausland and Freekibble", "Trivia questions that feed shelter dogs", "USA", [39.50, -98.35], "2008", "Teens",
  "Mimi Ausland began volunteering at her local animal shelter when she was nine. A few years later she started Freekibble, a website where each trivia question answered, right or wrong, donates 10 pieces of kibble to shelter animals.",
  "She found a way to turn a few seconds of clicking into food for animals, using a free daily game.",
  "It had provided over 135,000 meals in its early years and later reported millions of meals, along with food donated to food banks.",
  ["Create a simple online or paper quiz to raise awareness and collect pet food. Deliver the food to a shelter yourself."],
  ["fundraise", "kidbiz", "wildlife"], "Freekibble Mimi Ausland");
